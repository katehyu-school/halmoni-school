   이미 화면 위쪽 말풍선에 나오는 "아, 여기 있어요!"와 그림이 일치하는 부엌5.webp를 사용 — 스포일러 없음 */
const BG = { g1:'리아네 부엌1.webp', g2:'리아네 부엌3.webp', g3:'리아네 부엌5.webp' };
/* ⚠️ 숨은그림찾기 배경은 "정답이 말풍선에 없는" 슬라이드를 써야 함 —
   부엌4.webp는 "거기 식탁 위에 있어"(정답)가 그림 속 말풍선에 그대로 박혀 있어서 스포일러가 됨.
   부엌3.webp는 리나의 질문("엄마 내 점심 도시락 어디 있어요?")만 있어 안전함. */
const SEARCH_BG = '리아네 부엌3.webp';

/* ══════════════════════════════════════════════════════════════════
   ENGINE — 여기서부터는 고치지 않으셔도 됩니다
   ══════════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const S = { scene:'title', started:0, mistakes:0, hints:0, hsWrong:{}, hsFoundKey:null, msg:null, hintOpen:false };

/* ── 소리 ── */
let voiceKo = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices()||[];
    voiceKo = vs.find(v=>/ko[-_]KR/i.test(v.lang)) || vs.find(v=>/^ko/i.test(v.lang)) || null;
  }catch(e){}
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

let curAudio = null, playToken = 0;
function stopAudio(){
  playToken++;
  try{ if(curAudio){ curAudio.onended=null; curAudio.pause(); curAudio.currentTime=0; curAudio=null; } }catch(e){}
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
}
function say(line, then){
  if(!line){ if(then) then(); return; }
  stopAudio();
  const my = playToken;
  let fired = false;
  const done = ()=>{ if(fired || my!==playToken) return; fired = true; if(then) then(); };
  if(line.audio){
    const a = new Audio(TTS + encodeURIComponent(line.audio));
    a.volume = line.vol || 1;
    curAudio = a;
    /* ⚠️ 오디오가 404 등으로 실패하면 onerror 이벤트와 play()의 Promise 거부가
       "따로" 둘 다 발생할 수 있어서, 가드 없이 두 곳에서 speakTTS()를 부르면
       같은 문장이 두 번 겹쳐 재생되는 버그가 있었음 — 한 번만 실행되도록 막음
       (2026-09-10, dr-play-library.html에서 실제 재생 중복 제보로 발견 후 공통 수정) */
    let fallbackFired = false;
    const fallback = ()=>{
      if(fallbackFired || my!==playToken) return;
      fallbackFired = true;
      speakTTS(line.ko, my, then);
    };
    a.onended = done;
    a.onerror = fallback;
    a.onplaying = ()=>{
      if(isFinite(a.duration) && a.duration>0)
        setTimeout(done, Math.max(0, a.duration - a.currentTime)*1000 + 500);
    };
    setTimeout(done, 15000);
    a.play().catch(fallback);
    return;
  }
  speakTTS(line.ko, my, then);
}
function speakTTS(text, tok, then){
  if(!window.speechSynthesis || !text){ if(then) then(); return; }
  if(tok===undefined) { stopAudio(); tok = playToken; }
  if(tok!==playToken) return;
  let fired = false;
  const done = ()=>{ if(fired || tok!==playToken) return; fired = true; if(then) then(); };
  try{
    // 물결표(~)는 오디오 파일이 없을 때만 쓰는 브라우저 TTS가 "물결표시"라고 그대로 읽어버려서 미리 제거
    const u = new SpeechSynthesisUtterance(String(text).replace(/\n/g,' ').replace(/~/g,''));
    u.lang = 'ko-KR'; u.rate = 0.88;
    if(voiceKo) u.voice = voiceKo;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
    setTimeout(done, 900 + String(text).length * 190);
  }catch(e){ done(); }
}

/* ── 조각 ── */
const LINES = [];
function reg(line){ LINES.push(line); return LINES.length-1; }
function sayIdx(i){ say(LINES[i]); }

function bub(cls, emoji, who, line){
  const idx = reg(line);
  return `<div class="say">
    <div class="who"><span class="em">${emoji}</span>${esc(who)}</div>
    <div class="bub ${cls}">
      <button class="spk" onclick="sayIdx(${idx})" title="듣기">🔊</button>
      <div class="ko">${esc(line.ko)}</div>
      <div class="en">${esc(line.en)}</div>
    </div></div>`;
}
const mom  = l => bub('mom','👩','엄마', l);
const lina = l => bub('lina','👧','리나', l);
const narr = l => `<div class="narr">${esc(l.ko)}<div style="font-size:11.5px;color:var(--warm-600);margin-top:4px">${esc(l.en)}</div></div>`;

function optBtn(o, i, handler){
  return `<button class="opt" onclick="${handler}(${i})">
    <div class="ko">${esc(o.ko)}</div><div class="en">${esc(o.en)}</div></button>`;
}
function hintBox(key){
  const h = SCRIPT.hints[key];
  return `<div class="btnrow">
      <button class="btn ghost" onclick="toggleHint('${key}')">👩 ${S.hintOpen?'힌트 닫기':'엄마에게 물어보기 · Ask Mom'}</button>
    </div>` + (S.hintOpen && h ? `<div class="hint"><div class="hint-t">💡 해답 · ANSWER</div>${esc(h.ko)}<div style="font-size:11.5px;color:var(--warm-600);margin-top:4px">${esc(h.en)}</div></div>` : '');
}
function toggleHint(key){
  if(!S.hintOpen) S.hints++;
  S.hintOpen = !S.hintOpen;
  render();
}
function flash(line, kind){ if(line) S.msg = { line:line, kind:kind||'bad' }; }
function msgBox(){
  if(!S.msg) return '';
  const m = S.msg; S.msg = null;
  const style = m.kind==='good'
    ? 'background:var(--teal-lt);border-color:var(--teal-md)'
    : 'background:var(--coral-lt);border-color:#f0b8ab';
  return `<div class="narr" style="${style}">${esc(m.line.ko)}<div style="font-size:11.5px;color:var(--warm-600);margin-top:4px">${esc(m.line.en)}</div></div>`;
}

/* ── HUD ── */
function hud(){
  const goals = { title:'🍱 도시락을 찾아라!', g1:'🔑 관문 1 — 아침 먹기', g2:'🔍 관문 2 — 도시락 찾기',
                  g3:'🔑 관문 3 — 인사하고 가기', end:'🎬 완료!' };
  const goalsEn = { title:'Find the Lunchbox!', g1:'Gate 1 — Breakfast', g2:'Gate 2 — Search',
                    g3:'Gate 3 — Say goodbye', end:'Done!' };
  $('hudGoal').innerHTML = `${esc(goals[S.scene]||'')}<small>${esc(goalsEn[S.scene]||'')}</small>`;
  $('hudMiss').textContent = '😅 ' + S.mistakes + ' 실수';
}
function tick(){
  if(!S.started || S.scene==='end') return;
  const s = Math.floor((Date.now()-S.started)/1000);
  $('hudTime').textContent = '⏱ ' + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
setInterval(tick, 500);

const BG_EMOJI = { g1:'🍳', g2:'🔍', g3:'🎒' };
function setBg(key){
  const wrap = $('sceneWrap'), img = $('sceneImg'), fb = $('sceneFallback');
  if(!key){ wrap.hidden = true; return; }
  wrap.hidden = false;
  fb.firstElementChild.textContent = BG_EMOJI[key] || '🍳';
  img.onerror = () => { img.style.visibility='hidden'; fb.hidden = false; };
  img.onload  = () => { img.style.visibility='visible'; fb.hidden = true; };
  img.src = SLIDES + encodeURIComponent(BG[key]);
}

/* ══ 화면들 ══ */
function render(){
  hud();
  LINES.length = 0;
  const b = $('body');
  if(S.scene==='title') return setBg(null), b.innerHTML = viewTitle();
  if(S.scene==='g1')    return setBg('g1'), b.innerHTML = viewG1();
  if(S.scene==='g2')    return setBg(null), b.innerHTML = viewG2();   /* g2는 자체 이미지(hs-wrap)를 그림 */
  if(S.scene==='g3')    return setBg('g3'), b.innerHTML = viewG3();
  if(S.scene==='end')   return setBg('g3'), b.innerHTML = viewEnd();
}

function viewTitle(){
  return `<div class="center">
    <div class="big-emoji">🍱</div>
    <h1>${esc(SCRIPT.title.ko)}</h1>
    <div class="sub">${esc(SCRIPT.title.en)}</div>
    <div class="note">${esc(SCRIPT.momNote.ko)}<div class="en">${esc(SCRIPT.momNote.en)}</div></div>
    <div class="card">
      <h3>🎯 ${esc(SCRIPT.subtitle.ko)}</h3>
      ${esc(SCRIPT.subtitle.en)}<br>
      <span style="color:var(--warm-600);font-size:13px">👩 ${esc(SCRIPT.howto.en)}</span>
    </div>
    <button class="btn" onclick="start()">시작하기 · Start</button>
  </div>`;
}
function start(){ S.started = Date.now(); S.scene='g1'; S.hintOpen=false; render(); say(SCRIPT.g1_mom_call); }

/* 관문 1 — 아침 먹기 */
function viewG1(){
  let h = msgBox() + mom(SCRIPT.g1_mom_call);
  h += `<div class="narr" style="margin-top:-4px">${esc(SCRIPT.g1_ask_t.ko)}</div>`;
  h += `<div class="opts">${SCRIPT.g1_opts.map((o,i)=>optBtn(o,i,'chooseG1')).join('')}</div>`;
  h += hintBox('g1');
  return h;
}
function chooseG1(i){
  const o = SCRIPT.g1_opts[i];
  if(o.ok){
    S.scene='g2'; S.hintOpen=false; S.hsWrong={}; S.hsFoundKey=null;
    say(o, ()=>{ if(S.scene==='g2') say(SCRIPT.g2_ask); });
    render(); return;
  }
  S.mistakes++; flash(o.reply); say(o, ()=>say(o.reply)); render();
}

/* 관문 2 — 숨은그림찾기 */
function viewG2(){
  let h = msgBox() + lina(SCRIPT.g2_ask);
  h += `<div class="narr" style="margin-top:-4px">🔒 ${esc(SCRIPT.g2_search_t.ko)}<div style="font-size:11.5px;margin-top:3px">${esc(SCRIPT.g2_search_t.en)}</div></div>`;
  h += `<div class="hs-wrap" id="hsWrap">
      <img id="hsImg" alt="" src="${SLIDES}${encodeURIComponent(SEARCH_BG)}"
           onerror="this.style.visibility='hidden'; document.getElementById('hsFallback').hidden=false;">
      <div class="hs-fallback" id="hsFallback" hidden><span style="font-size:64px">🍳</span></div>
      ${HOTSPOTS.map((hs,i)=>{
        const state = S.hsWrong[hs.key] ? 'done wrong' : (S.hsFoundKey===hs.key ? 'done right' : '');
        const icon = S.hsFoundKey===hs.key ? '✅' : (S.hsWrong[hs.key] ? '❌' : '❓');
        return `<button class="hotspot ${state}" style="left:${hs.left}%;top:${hs.top}%;width:${hs.width}%;height:${hs.height}%"
                   onclick="clickHotspot('${hs.key}')" title="살펴보기"><span class="pin">${icon}</span></button>`;
      }).join('')}
    </div>`;
  h += `<div class="hs-caption">🔍 부엌 곳곳을 눌러 보세요 · Tap around the kitchen</div>`;
  h += hintBox('g2');
  return h;
}
function clickHotspot(key){
  if(S.hsFoundKey) return;               /* 이미 찾았으면 더 이상 반응 안 함 */
  const hs = HOTSPOTS.find(h=>h.key===key);
  if(!hs || S.hsWrong[key]) return;      /* 이미 눌러본 오답은 다시 세지 않음 */
  if(hs.ok){
    S.hsFoundKey = key;
    say(hs, ()=>{ if(S.scene==='g2') say(SCRIPT.g2_found_line, ()=>{ if(S.scene==='g2'){ S.scene='g3'; S.hintOpen=false; render(); } }); });
  }else{
    S.hsWrong[key] = true;
    S.mistakes++;
    say(hs);
  }
  render();
}

/* 관문 3 — 인사하고 학교 가기 */
function viewG3(){
  let h = msgBox() + lina(SCRIPT.g2_found_line) + narr(SCRIPT.g3_narr);
  h += `<div class="narr" style="margin-top:-4px">${esc(SCRIPT.g3_ask_t.ko)}<div style="font-size:11.5px;margin-top:3px">${esc(SCRIPT.g3_ask_t.en)}</div></div>`;
  h += `<div class="opts">${SCRIPT.g3_opts.map((o,i)=>optBtn(o,i,'chooseG3')).join('')}</div>`;
  h += hintBox('g3');
  return h;
}
function chooseG3(i){
  const o = SCRIPT.g3_opts[i];
  if(o.ok){
    S.scene='end';
    say(o, ()=>{ say(SCRIPT.g3_mom_reply, ()=>{ say(SCRIPT.g3_lina_bye); }); });
    render(); return;
  }
  S.mistakes++; flash(o.reply); say(o, ()=>say(o.reply)); render();
}

/* 엔딩 */
function viewEnd(){
  const secs = Math.floor((Date.now()-S.started)/1000);
  const end = S.mistakes >= 4               ? SCRIPT.end_awk
            : (S.mistakes === 0 && S.hints===0) ? SCRIPT.end_best
            :                                     SCRIPT.end_mid;
  return `<div class="center">
    ${mom(SCRIPT.g3_mom_reply)}${lina(SCRIPT.g3_lina_bye)}
    <div class="big-emoji" style="margin-top:14px">${end.emoji}</div>
    <h1 style="font-size:30px">${esc(end.ko)}</h1>
    <div class="sub">${esc(end.en)}</div>
    <div class="card">${esc(end.msg.ko)}<div style="font-size:12px;color:var(--warm-600);margin-top:5px">${esc(end.msg.en)}</div></div>
    <div class="score">
      <div><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b><span>걸린 시간 · time</span></div>
      <div><b>${S.hints}</b><span>힌트 · hints</span></div>
      <div><b>${S.mistakes}</b><span>실수 · slips</span></div>
    </div>
    <div class="btnrow" style="justify-content:center">
      <button class="btn" onclick="restart()">다시 하기 · Play again</button>
      <a class="btn ghost" style="text-decoration:none" href="nhs.html?ep=ep08">이 편 공부하기 →</a>
    </div>
  </div>`;
}
function restart(){
  stopAudio();
  Object.assign(S, { scene:'title', started:0, mistakes:0, hints:0, hsWrong:{}, hsFoundKey:null, msg:null, hintOpen:false });
  $('hudTime').textContent = '⏱ 0:00';
  render();
}

render();
</script>
</body>
