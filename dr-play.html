<style>
:root{
  --teal:#0f7c6e; --teal-lt:#e0f5f2; --teal-md:#5bbfb0; --teal-dark:#0b5c52; --teal-600:#1a9485;
  --amber:#c47a1a; --amber-lt:#fdf3e0; --coral:#c74d36; --coral-lt:#fdeae6;
  --blue:#1a5fa8; --blue-lt:#e6f0fb; --purple:#5a3fa0;
  --warm-900:#1C1917; --warm-800:#292524; --warm-700:#44403C; --warm-600:#57534E; --warm-500:#78716C;
  --paper:#fbf8f3; --line:#e7ddd0;
  --font-kr:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-kr);
  background:#12100e;
  color:var(--warm-900);
  min-height:100vh;
  display:flex; align-items:flex-start; justify-content:center;
  padding:0;
}
#stage{
  width:100%; max-width:760px; background:var(--paper);
  min-height:100vh; display:flex; flex-direction:column;
  box-shadow:0 0 60px rgba(0,0,0,.5);
}

/* ── 상단 HUD ───────────────────────── */
#hud{
  background:var(--teal-dark); color:#fff; padding:9px 14px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  font-size:12.5px; position:sticky; top:0; z-index:20;
}
#hud .goal{flex:1; min-width:150px; font-weight:500; line-height:1.4}
#hud .goal small{display:block; opacity:.75; font-size:10.5px; font-weight:400}
.chip{background:rgba(255,255,255,.14); border-radius:999px; padding:4px 10px; white-space:nowrap; font-variant-numeric:tabular-nums}

/* ── 장면 ───────────────────────────── */
#sceneWrap{position:relative; width:100%; aspect-ratio:16/9; background:#241f1a}
#sceneImg{width:100%; height:100%; object-fit:cover; display:block}
#sceneFallback{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(150deg,#0b5c52,#1a9485);
}
/* ⚠️ display를 지정하면 hidden 속성이 무시됨 — 반드시 같이 둘 것 */
#sceneFallback[hidden]{display:none}
#sceneWrap[hidden]{display:none}
#sceneFallback span{font-size:76px; filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
#body{padding:16px 16px 26px; flex:1}

.narr{
  background:var(--amber-lt); border:1.5px solid #f0c980; border-radius:var(--radius);
  padding:12px 15px; font-size:13.5px; line-height:1.75; color:var(--warm-800); margin-bottom:14px;
}
.narr b{color:var(--amber)}

/* 대사 말풍선 */
.say{display:flex; gap:10px; margin-bottom:12px; align-items:flex-start}
.say .who{
  flex:0 0 auto; width:44px; text-align:center; font-size:11px; color:var(--warm-600); line-height:1.3;
}
.say .who .em{display:block; font-size:26px; line-height:1.1}
.bub{
  flex:1; background:#fff; border:1.5px solid var(--line); border-radius:var(--radius);
  padding:11px 14px; position:relative;
}
.bub.ajumma{background:var(--coral-lt); border-color:#f0b8ab}
.bub.bomi{background:var(--blue-lt); border-color:#b9d3ef}
.bub.me{background:var(--teal-lt); border-color:var(--teal-md)}
.bub .ko{font-size:16px; font-weight:500; line-height:1.65; color:var(--warm-900)}
.bub .en{font-size:12px; color:var(--warm-600); margin-top:3px; line-height:1.5}
.spk{
  background:none; border:none; cursor:pointer; font-size:15px; padding:2px 4px;
  float:right; margin:-2px -4px 0 6px; opacity:.55;
}
.spk:hover{opacity:1}

/* 살펴보기 */
.look-wrap{margin:16px 0 6px}
.sec-t{font-size:12px; font-weight:700; color:var(--warm-600); letter-spacing:.4px; margin-bottom:8px}
.looks{display:flex; gap:8px; flex-wrap:wrap}
.look{
  background:#fff; border:1.5px solid var(--line); border-radius:999px;
  padding:8px 14px; font-size:13.5px; cursor:pointer; transition:.15s;
}
.look:hover{border-color:var(--amber); background:var(--amber-lt)}
.look.seen{opacity:.5}

/* 선택지 */
.opts{display:flex; flex-direction:column; gap:9px; margin-top:6px}
.opt{
  text-align:left; background:#fff; border:2px solid var(--line); border-radius:var(--radius);
  padding:12px 15px; cursor:pointer; font-family:inherit; transition:.15s; width:100%;
}
.opt:hover{border-color:var(--teal); background:var(--teal-lt); transform:translateX(2px)}
.opt .ko{font-size:16px; font-weight:500; color:var(--warm-900); line-height:1.55}
.opt .en{font-size:11.5px; color:var(--warm-500); margin-top:2px}

/* 주문 조립기 */
.builder{background:#fff; border:2px solid var(--teal-md); border-radius:var(--radius); padding:14px; margin-top:6px}
.brow{margin-bottom:13px}
.blabel{font-size:11.5px; font-weight:700; color:var(--teal); margin-bottom:6px}
.bchips{display:flex; gap:7px; flex-wrap:wrap}
.bchip{
  background:#fff; border:1.5px solid var(--line); border-radius:999px;
  padding:7px 13px; font-size:14px; cursor:pointer; font-family:inherit; transition:.12s;
}
.bchip:hover{border-color:var(--teal-md)}
.bchip.on{background:var(--teal); border-color:var(--teal); color:#fff; font-weight:600}
.bchip small{opacity:.7; font-size:11px; margin-left:3px}
.preview{
  background:var(--teal-lt); border:1.5px dashed var(--teal-md); border-radius:10px;
  padding:12px 14px; margin:4px 0 12px; font-size:17px; font-weight:500; color:var(--teal-dark);
  min-height:52px; line-height:1.5;
}
.preview .ph{color:var(--warm-500); font-weight:400; font-size:14px}
.preview .tot{display:block; font-size:12px; color:var(--warm-600); font-weight:400; margin-top:5px}
.preview .over{color:var(--coral); font-weight:700}

/* 버튼 */
.btn{
  background:var(--teal); color:#fff; border:none; border-radius:999px;
  padding:12px 26px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
}
.btn:hover{background:var(--teal-600)}
.btn:disabled{background:#c9c2b8; cursor:not-allowed}
.btn.ghost{background:none; color:var(--warm-600); border:1.5px solid var(--line); font-weight:500}
.btn.ghost:hover{background:#fff; color:var(--warm-900)}
.btnrow{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-top:12px}

/* 힌트(해답) — 주문 조립기처럼 굵은 테두리로 다른 안내 상자들과 확실히 구별 */
.hint{
  background:var(--blue-lt); border:2px solid var(--blue); border-radius:var(--radius);
  padding:13px 15px; font-size:13.5px; line-height:1.7; color:var(--warm-800); margin-top:12px;
  box-shadow:0 2px 0 rgba(26,95,168,.10);
}
.hint .hint-t{
  font-size:11.5px; font-weight:700; color:var(--blue); letter-spacing:.4px;
  margin-bottom:6px; display:flex; align-items:center; gap:5px;
}


/* 잠김 표시 */
.locked{
  background:#fff; border:2px dashed #d8ccbb; border-radius:var(--radius);
  padding:13px 15px; font-size:13.5px; color:var(--warm-600); margin-top:10px; line-height:1.6;
}

/* 타이틀 / 엔딩 */
.center{text-align:center; padding:26px 6px}
.center h1{font-family:'Gaegu',var(--font-kr); font-size:40px; margin:8px 0 2px; color:var(--teal-dark); line-height:1.15}
.center .sub{font-size:14px; color:var(--warm-600); margin-bottom:20px}
.card{
  background:#fff; border:1.5px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; text-align:left; font-size:14px; line-height:1.8; margin:14px 0;
}
.card h3{margin:0 0 8px; font-size:14px; color:var(--teal)}
.note{
  background:#fffdf5; border:1.5px solid #e8d9a8; border-radius:6px;
  padding:16px 18px; font-family:'Gaegu',var(--font-kr); font-size:21px; line-height:1.7;
  color:#5c4a1e; box-shadow:2px 3px 0 rgba(0,0,0,.06); transform:rotate(-.6deg); text-align:left;
}
.note .en{font-family:var(--font-kr); font-size:12.5px; color:#8a7440; margin-top:7px; line-height:1.5}
.score{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:16px 0}
.score div{background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:10px 16px; min-width:88px}
.score b{display:block; font-size:21px; color:var(--teal-dark); font-variant-numeric:tabular-nums}
.score span{font-size:11px; color:var(--warm-600)}
.big-emoji{font-size:56px; line-height:1}

footer{padding:16px; text-align:center; font-size:11.5px; color:var(--warm-500); border-top:1px solid var(--line)}
footer a{color:var(--teal); text-decoration:none}

@media(max-width:520px){
  .center h1{font-size:32px}
  .bub .ko,.opt .ko{font-size:15px}
  #hud{font-size:11.5px}
  .preview{font-size:15px}
}
</style>

let voiceKo = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices()||[];
    voiceKo = vs.find(v=>/ko[-_]KR/i.test(v.lang)) || vs.find(v=>/^ko/i.test(v.lang)) || null;
  }catch(e){}
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

let curAudio = null, playToken = 0;

/* 재생 중인 것을 mp3·브라우저음성 양쪽 다 확실히 멈춤 — 겹쳐 들리는 걸 막는 핵심 */
function stopAudio(){
  playToken++;
  try{ if(curAudio){ curAudio.onended=null; curAudio.pause(); curAudio.currentTime=0; curAudio=null; } }catch(e){}
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
}

/* say(대사, 끝난뒤할일) — 두 번째 인자를 주면 이 대사가 끝난 뒤에 이어서 재생됨(동시에 안 나옴) */
function say(line, then){
  if(!line){ if(then) then(); return; }
  stopAudio();
  const my = playToken;
  let fired = false;
  const done = ()=>{ if(fired || my!==playToken) return; fired = true; if(then) then(); };
  if(line.audio){
    const a = new Audio(TTS + encodeURIComponent(line.audio));
    curAudio = a;
    a.onended = done;
    a.onerror = ()=>{ if(my===playToken) speakTTS(line.ko, my, then); };
    // ⚠️ 반드시 '소리가 실제로 나기 시작한' playing 시점 기준으로 예약할 것.
    //    loadedmetadata 시점으로 재면 버퍼링 시간만큼 일찍 울려서 다음 대사가 겹쳐 나옴(2026-09-07 실제 버그).
    a.onplaying = ()=>{
      if(isFinite(a.duration) && a.duration>0)
        setTimeout(done, Math.max(0, a.duration - a.currentTime)*1000 + 500);
    };
    // 최후 안전장치 — 자동재생이 막히거나 파일이 안 열려도 대화가 멈추지 않게
    setTimeout(done, 15000);
    a.play().catch(()=>{ if(my===playToken) speakTTS(line.ko, my, then); });
    return;
  }
  speakTTS(line.ko, my, then);
}

function speakTTS(text, tok, then){
  if(!window.speechSynthesis || !text){ if(then) then(); return; }
  if(tok===undefined) { stopAudio(); tok = playToken; }
  if(tok!==playToken) return;
  let fired = false;
  const done = ()=>{ if(fired || tok!==playToken) return; fired = true; if(then) then(); };
  try{
    const u = new SpeechSynthesisUtterance(String(text).replace(/\n/g,' '));
    u.lang = 'ko-KR'; u.rate = 0.88;
    if(voiceKo) u.voice = voiceKo;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
    // 안전장치: 일부 브라우저에서 onend가 안 옴 — 글자 수로 대략 잡아 둠
    setTimeout(done, 900 + String(text).length * 190);
  }catch(e){ done(); }
}

function orderText(){
  const parts = S.order.food.map(f=>{
    const q = S.order.qty[f];
    return esc(f) + (q ? ' ' + esc(q.label) : '');
  });
  if(!parts.length) return null;
  if(parts.length === 1) return parts[0] + ' 주세요.';
  const c = S.order.conn;
  // 앞말에 받침이 있으면 「이랑 / 과」, 없으면 「랑 / 와」 — 「하고」는 항상 같음
  const hasBatchim = w => { const ch=w.charCodeAt(w.length-1); return ch>=0xAC00&&ch<=0xD7A3 ? (ch-0xAC00)%28!==0 : false; };
  const bat = hasBatchim(parts[0]);
  let joiner = ' ';
  if(c && c.ok) joiner = c.label==='(이)랑' ? (bat?'이랑 ':'랑 ')
                       : c.label==='와/과'  ? (bat?'과 ':'와 ')
                       : '하고 ';
  return parts.join(joiner) + ' 주세요.';
}
function orderTotal(){
  return S.order.food.reduce((t,f)=>{
    const m = MENU.find(x=>x.ko===f), q = S.order.qty[f];
    return t + (m && q ? m.price*q.n : 0);

      ${QTYS.map((q,qi)=>`<button class="bchip ${S.order.qty[f]&&S.order.qty[f].label===q.label?'on':''}" onclick="pickQty('${esc(f)}',${qi})">${esc(q.label)}</button>`).join('')}
    </div></div>`).join('')}

    ${S.order.food.length>1?`<div class="brow"><div class="blabel">③ ${esc(SCRIPT.g2_lbl_conn.ko)} · ${esc(SCRIPT.g2_lbl_conn.en)}</div><div class="bchips">
      ${CONNS.map((c,ci)=>`<button class="bchip ${S.order.conn&&S.order.conn.label===c.label?'on':''}" onclick="pickConn(${ci})">${esc(c.label)}</button>`).join('')}
    </div></div>`:''}

    <div class="btnrow">
      <button class="btn" onclick="submitOrder()" ${txt?'':'disabled'}>${esc(SCRIPT.g2_say.ko)} · ${esc(SCRIPT.g2_say.en)}</button>
      <button class="btn ghost" onclick="resetOrder()">다시 고르기</button>
    </div>
  </div>`;
  h += hintBox('g2order');
  return h;
}
function pickFood(f){
  const i = S.order.food.indexOf(f);
  if(i>=0){ S.order.food.splice(i,1); delete S.order.qty[f]; }
  else if(S.order.food.length<2) S.order.food.push(f);
  render();
}
function pickQty(f, qi){ S.order.qty[f] = QTYS[qi]; render(); }
function pickConn(ci){ S.order.conn = CONNS[ci]; render(); }
function resetOrder(){ S.order = { food:[], qty:{}, conn:null }; render(); }

function submitOrder(){
  const txt = orderText(); if(!txt) return;
  const spoken = { ko: txt, en: '' };
  const foods = S.order.food, tot = orderTotal();

  let bad = null;
  if(foods.some(f=>!S.order.qty[f]))                             bad = SCRIPT.g2_fail_qty;
  else if(foods.some(f=>S.order.qty[f].native))                  bad = SCRIPT.g2_fail_qty;
  else if(foods.length>1 && (!S.order.conn || !S.order.conn.ok)) bad = SCRIPT.g2_fail_conn;
  else if(tot > WALLET){ S.overordered = true;                   bad = SCRIPT.g2_fail_over; }
  else {
    const want = Object.keys(CORRECT_ORDER);
    const okSet = foods.length===want.length && want.every(w=>foods.includes(w) && S.order.qty[w] && S.order.qty[w].n===CORRECT_ORDER[w]);
    if(!okSet) bad = SCRIPT.g2_fail_wrong;
  }

  // 내가 말한 주문을 먼저 들려주고, 끝난 뒤에 아줌마가 대답 — 겹치지 않게
  if(bad){ S.mistakes++; flash(bad); say(spoken, ()=>say(bad)); return render(); }

  if(S.order.conn && S.order.conn.bookish) flash(SCRIPT.g2_conn_note, 'good');
  S.paid = tot;
  S.scene = 'g3eat'; S.hintOpen = false;
  say(spoken, ()=>{ if(S.scene==='g3eat') say(SCRIPT.g2_ok); });
  render();
}

/* 관문 3 — 맛 */
function viewG3Eat(){
  let h = msgBox() + ajumma(SCRIPT.g2_ok) + narr(SCRIPT.g3_eat_narr);
  h += `<div class="sec-t" style="margin-top:14px">💬 한 마디 · SAY SOMETHING</div>`;
  h += `<div class="opts">${SCRIPT.g3_eat_opts.map((o,i)=>optBtn(o,i,'chooseEat')).join('')}</div>`;
  h += hintBox('g3eat');
  return h;
}
function chooseEat(i){
  const o = SCRIPT.g3_eat_opts[i];
  if(o.ok){ S.scene='g3pay'; S.hintOpen=false; flash(o.reply,'good'); say(o, ()=>{ if(S.scene==='g3pay') say(o.reply); }); render(); return; }
  S.mistakes++; flash(o.reply); say(o); render();
}

/* 관문 3 — 계산 */
function viewG3Pay(){
  let h = msgBox() + narr(SCRIPT.g3_pay_narr);
  h += `<div class="locked">🔒 값을 물어봐야 계산할 수 있어요.<div style="font-size:11.5px;margin-top:3px">You need to ask the price first.</div></div>`;
  h += `<div class="opts">${SCRIPT.g3_pay_opts.map((o,i)=>optBtn(o,i,'choosePay')).join('')}</div>`;
  h += hintBox('g3pay');
  return h;
}
function choosePay(i){
  const o = SCRIPT.g3_pay_opts[i];
  if(o.ok){ S.scene='g3bye'; S.hintOpen=false; flash(o.note,'good'); say(o, ()=>{ if(S.scene==='g3bye') say(SCRIPT.g3_price); }); render(); return; }
  S.mistakes++; flash(o.reply); say(o); render();
}

/* 관문 3 — 작별 */
function viewG3Bye(){
  let h = msgBox() + ajumma(SCRIPT.g3_price);
  h += `<div style="font-size:13px;color:var(--warm-600);margin:2px 0 12px">💰 ${won(S.paid)} 냈어요. 남은 돈 ${won(WALLET-S.paid)}.</div>`;
  h += narr(SCRIPT.g3_bye_narr);
  h += `<div class="locked">🔒 인사를 잘못하면 문이 안 열려요.<div style="font-size:11.5px;margin-top:3px">The wrong goodbye won’t open the door.</div></div>`;
  h += `<div class="opts">${SCRIPT.g3_bye_opts.map((o,i)=>optBtn(o,i,'chooseBye')).join('')}</div>`;
  h += hintBox('g3bye');
  return h;
}
function chooseBye(i){
  const o = SCRIPT.g3_bye_opts[i];
  if(o.ok){ S.scene='end'; say(o, ()=>{ if(S.scene==='end') say(SCRIPT.g3_farewell); }); render(); return; }
  S.mistakes++; flash(o.reply); say(o); render();
}

/* 엔딩 */
function viewEnd(){
  const secs = Math.floor((Date.now()-S.started)/1000);
  const end = S.mistakes >= 3               ? SCRIPT.end_awk
            : (S.mistakes <= 1 && S.hints===0) ? SCRIPT.end_best
            :                                    SCRIPT.end_mid;
  return `<div class="center">
    ${ajumma(SCRIPT.g3_farewell)}
    <div class="big-emoji" style="margin-top:14px">${end.emoji}</div>
    <h1 style="font-size:32px">${esc(end.ko)}</h1>
    <div class="sub">${esc(end.en)}</div>
    <div class="card">${esc(end.msg.ko)}<div style="font-size:12px;color:var(--warm-600);margin-top:5px">${esc(end.msg.en)}</div></div>
    <div class="score">
      <div><b>${won(WALLET-S.paid).replace('원','')}</b><span>남은 돈 · change</span></div>
      <div><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b><span>걸린 시간 · time</span></div>
      <div><b>${S.hints}</b><span>힌트 · hints</span></div>
      <div><b>${S.mistakes}</b><span>실수 · slips</span></div>
    </div>
    <div class="btnrow" style="justify-content:center">
      <button class="btn" onclick="restart()">다시 하기 · Play again</button>
      <a class="btn ghost" style="text-decoration:none" href="nhs.html?ep=ep06">이 편 공부하기 →</a>
    </div>
  </div>`;
}
function restart(){
  stopAudio();
  Object.assign(S, { scene:'title', started:0, mistakes:0, hints:0, overordered:false,
    paid:0, seen:{}, order:{ food:[], qty:{}, conn:null }, msg:null, hintOpen:false });
  $('hudTime').textContent = '⏱ 0:00';
  render();
}

render();
</script>
</body>
