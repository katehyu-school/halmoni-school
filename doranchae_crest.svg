<svg width="100%" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Doranchae 크레스트 — 한옥 지붕 아래 ㄷㅊ</title>
<desc>기와지붕 아래 ㄷ(툇마루)과 ㅊ(사람)이 나란히 놓인 크레스트. ㅊ의 윗점은 훈민정음의 옛 형태를 따라 둥근 점으로 그렸다.</desc>

<!-- ══ 웹용 다크 (center x=220) ══ -->
<rect x="120" y="24" width="200" height="240" rx="14" fill="#0a2540"/>

<!-- 기와지붕 -->
<path d="M153 98 Q158 93 166 97 L220 52 L274 97 Q281 93 287 98" fill="none" stroke="#4ECDC4" stroke-width="2" stroke-linejoin="round"/>
<path d="M153 98 L220 52 L287 98" fill="#4ECDC4" opacity="0.07"/>
<line x1="156" y1="100" x2="284" y2="100" stroke="#4ECDC4" stroke-width="1.2" opacity="0.5"/>
<line x1="180" y1="100" x2="180" y2="108" stroke="#4ECDC4" stroke-width="1" opacity="0.3"/>
<line x1="220" y1="100" x2="220" y2="108" stroke="#4ECDC4" stroke-width="1" opacity="0.3"/>
<line x1="260" y1="100" x2="260" y2="108" stroke="#4ECDC4" stroke-width="1" opacity="0.3"/>

<!-- ㄷ — 툇마루, 중앙 정렬 -->
<rect x="181" y="117" width="26" height="2.8" rx="1.4" fill="#4ECDC4"/>
<rect x="181" y="117" width="2.8" height="36" rx="1.4" fill="#4ECDC4"/>
<rect x="181" y="150.2" width="26" height="2.8" rx="1.4" fill="#4ECDC4"/>

<!-- 중앙 구분 -->
<line x1="219" y1="114" x2="219" y2="158" stroke="#4ECDC4" stroke-width="0.6" opacity="0.2"/>

<!-- ㅊ — 사람, 윗점은 훈민정음 옛 형태 -->
<circle cx="243" cy="119" r="3.6" fill="#FF6B6B"/>
<rect x="228" y="128" width="30" height="2.8" rx="1.4" fill="#FF6B6B"/>
<line x1="243" y1="132" x2="232" y2="152" stroke="#FF6B6B" stroke-width="2.8" stroke-linecap="round"/>
<line x1="243" y1="132" x2="254" y2="152" stroke="#FF6B6B" stroke-width="2.8" stroke-linecap="round"/>

<!-- DORANCHAE -->
<text x="220" y="180" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="9" fill="#4ECDC4" letter-spacing="2">DORANCHAE</text>
<circle cx="208" cy="192" r="1.4" fill="#4ECDC4" opacity="0.45"/>
<circle cx="220" cy="195" r="1.4" fill="#4ECDC4" opacity="0.65"/>
<circle cx="232" cy="192" r="1.4" fill="#4ECDC4" opacity="0.45"/>

<text x="220" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b8394">웹용 (다크)</text>


<!-- ══ 프린트용 라이트 (center x=460) ══ -->
<rect x="360" y="24" width="200" height="240" rx="14" fill="#f4f8fb" stroke="#ddeaf2" stroke-width="1"/>

<path d="M393 98 Q398 93 406 97 L460 52 L514 97 Q521 93 527 98" fill="none" stroke="#0a2540" stroke-width="2" stroke-linejoin="round"/>
<path d="M393 98 L460 52 L527 98" fill="#0a2540" opacity="0.05"/>
<line x1="396" y1="100" x2="524" y2="100" stroke="#0a2540" stroke-width="1.2" opacity="0.4"/>
<line x1="420" y1="100" x2="420" y2="108" stroke="#0a2540" stroke-width="1" opacity="0.25"/>
<line x1="460" y1="100" x2="460" y2="108" stroke="#0a2540" stroke-width="1" opacity="0.25"/>
<line x1="500" y1="100" x2="500" y2="108" stroke="#0a2540" stroke-width="1" opacity="0.25"/>

<!-- ㄷ 라이트 -->
<rect x="421" y="117" width="26" height="2.8" rx="1.4" fill="#0a2540"/>
<rect x="421" y="117" width="2.8" height="36" rx="1.4" fill="#0a2540"/>
<rect x="421" y="150.2" width="26" height="2.8" rx="1.4" fill="#0a2540"/>

<line x1="459" y1="114" x2="459" y2="158" stroke="#0a2540" stroke-width="0.6" opacity="0.15"/>

<!-- ㅊ 라이트 -->
<circle cx="483" cy="119" r="3.6" fill="#c0392b"/>
<rect x="468" y="128" width="30" height="2.8" rx="1.4" fill="#c0392b"/>
<line x1="483" y1="132" x2="472" y2="152" stroke="#c0392b" stroke-width="2.8" stroke-linecap="round"/>
<line x1="483" y1="132" x2="494" y2="152" stroke="#c0392b" stroke-width="2.8" stroke-linecap="round"/>

<text x="460" y="180" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="9" fill="#0a2540" letter-spacing="2">DORANCHAE</text>
<circle cx="448" cy="192" r="1.4" fill="#0a2540" opacity="0.35"/>
<circle cx="460" cy="195" r="1.4" fill="#0a2540" opacity="0.5"/>
<circle cx="472" cy="192" r="1.4" fill="#0a2540" opacity="0.35"/>

<text x="460" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b8394">프린트용 (라이트)</text>


<!-- ══ 홈 화면 시뮬 ══ -->
<rect x="40" y="305" width="600" height="100" rx="12" fill="#061525"/>

<!-- 지붕 + 글자를 손으로 다시 그리지 않고 큰 카드 그림을 그대로 축소합니다.
     이렇게 해야 지붕과 글자의 비율이 큰 로고와 정확히 같습니다. -->
<g transform="translate(340,335) scale(0.396) translate(-220,-102.5)">
  <path d="M153 98 Q158 93 166 97 L220 52 L274 97 Q281 93 287 98" fill="none" stroke="#4ECDC4" stroke-width="2" stroke-linejoin="round"/>
  <path d="M153 98 L220 52 L287 98" fill="#4ECDC4" opacity="0.07"/>
  <line x1="156" y1="100" x2="284" y2="100" stroke="#4ECDC4" stroke-width="1.2" opacity="0.5"/>
  <line x1="180" y1="100" x2="180" y2="108" stroke="#4ECDC4" stroke-width="1" opacity="0.3"/>
  <line x1="220" y1="100" x2="220" y2="108" stroke="#4ECDC4" stroke-width="1" opacity="0.3"/>
  <line x1="260" y1="100" x2="260" y2="108" stroke="#4ECDC4" stroke-width="1" opacity="0.3"/>
  <rect x="181" y="117" width="26" height="2.8" rx="1.4" fill="#4ECDC4"/>
  <rect x="181" y="117" width="2.8" height="36" rx="1.4" fill="#4ECDC4"/>
  <rect x="181" y="150.2" width="26" height="2.8" rx="1.4" fill="#4ECDC4"/>
  <line x1="219" y1="114" x2="219" y2="158" stroke="#4ECDC4" stroke-width="0.6" opacity="0.2"/>
  <circle cx="243" cy="119" r="3.6" fill="#FF6B6B"/>
  <rect x="228" y="128" width="30" height="2.8" rx="1.4" fill="#FF6B6B"/>
  <line x1="243" y1="132" x2="232" y2="152" stroke="#FF6B6B" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="243" y1="132" x2="254" y2="152" stroke="#FF6B6B" stroke-width="2.8" stroke-linecap="round"/>
</g>

<text x="340" y="368" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="6" fill="#4ECDC4" letter-spacing="1.5">DORANCHAE</text>
<text x="340" y="372" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b8394">홈 화면</text>

</svg>
