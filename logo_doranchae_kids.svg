<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 464 528" role="img">
  <title>Doranchae Kids</title>
  <desc>기존 라이브 HQ Kids 배지(logo_kids.png)를 픽셀 단위로 실측 재구성 — 흰 여백(약 16px)+틸 방패+안쪽 라이트 테두리(흰색 32% 불투명)+별 2개(골드, 외곽선 없음)+DR/KIDS 텍스트. 원본은 Impact 지정이었으나 샌드박스에서 폰트가 없어 대체 세리프로 렌더돼 "둥근 느낌"으로 보였던 것 — 실제로 그 느낌을 의도적으로 재현하려면 Impact 대신 이미 이 앱(korean-app_v2.html)에 로드돼 있는 "Jua"(둥글고 아이 친화적인 한글 폰트, 라틴 대문자도 지원)를 추천. 2026-08-08: 상표권 문제로 HQ→DR(도란채 Doranchae 첫 두 글자)로 텍스트만 교체, 나머지 형태·색상·비율은 실측 그대로.</desc>

  <path d="M24 40 H440 V324 L232 506 L24 324 Z" fill="#ffffff"/>
  <path d="M40 56 H424 V318 L232 485 L40 318 Z" fill="#3DBCB5"/>
  <path d="M68 84 H396 V296 L232 453 L76 296 Z" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" opacity="0.33"/>

  <g fill="#FFD93D">
    <path transform="translate(143.5,192) scale(1.02)" d="M0,-46 L13.65,-14.2 L45.36,-14.2 L19.85,5.4 L29.5,37.2 L0,17.6 L-29.5,37.2 L-19.85,5.4 L-45.36,-14.2 L-13.65,-14.2 Z"/>
    <path transform="translate(320.5,192) scale(1.02)" d="M0,-46 L13.65,-14.2 L45.36,-14.2 L19.85,5.4 L29.5,37.2 L0,17.6 L-29.5,37.2 L-19.85,5.4 L-45.36,-14.2 L-13.65,-14.2 Z"/>
