<script>
const EPISODE_DATA = {};

function toggleMobileSidebar(){ document.body.classList.toggle('mobile-sidebar-open'); }
function closeMobileSidebar(){ document.body.classList.remove('mobile-sidebar-open'); }
document.addEventListener('click', function(e){
  if(!document.body.classList.contains('mobile-sidebar-open')) return;
  if(e.target.closest('.ep-item') || e.target.closest('.lt-item')) closeMobileSidebar();
});

let DATA=null,curTab='script',sceneIdx=0,qAnswered={},_audio=null;
let quizMode='mc',quizIdx=0,quizScore=0;
let _nhsRec={stream:null,recorder:null,chunks:[],blobURL:null,recording:false};
function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escA(s){return s==null?'':String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/[\r\n]+/g,' ');}
const CHAR_CFG={jeongmin:{bg:'#B8D4F0',emoji:'👦'},mirae:{bg:'#F0B8D4',emoji:'👧'},mom:{bg:'#B8D4B8',emoji:'👩'},narrator:{bg:'#E0E0E0',emoji:'📢'},jungmin:{bg:'#A8D8EA',emoji:'👦'},mina:{bg:'#FFB7C5',emoji:'👧'},staff:{bg:'#D4E8D0',emoji:'🎫'}};
// ── TRIAL ACCOUNTS ── ?trial URL param (set by index.html for role='trial' members) → 지정된 에피소드만 열람 가능
// localStorage에 플래그를 저장해서, start.html 등 쿼리스트링 없는 내부 링크를 거쳐도 잠금이 풀리지 않게 함
(function(){
  const _p = new URLSearchParams(location.search);
  if (_p.has('trial')) { try{ localStorage.setItem('nhs_trial','1'); }catch(e){} }
  else if (_p.has('name')) { try{ localStorage.removeItem('nhs_trial'); }catch(e){} } // 일반 로그인은 체험 플래그 해제
})();
const NHS_IS_TRIAL = new URLSearchParams(location.search).has('trial') || (function(){ try{ return localStorage.getItem('nhs_trial')==='1'; }catch(e){ return false; } })();
// 체험 계정에 열어 주는 범위 — 2026-08-06부터 Start Here + Level 1 '전체'.
// 3편만 열던 때보다 학생이 레벨 하나를 온전히 끝까지 겪어 볼 수 있습니다.
// 잠기는 것은 Level 2~6 탭뿐입니다(아래 setLevel 참고).
// ── 🔐 접근 등급 (2026-08-06 단계적 오픈) ─────────────────
//   비로그인(검색 유입) · 체험 계정  →  🌱 Start Here + Level 1~2
//   정식 회원(student·teacher·admin) →  전 레벨
//   왜 이렇게 하나: L3 이상은 아직 실제 학습자가 통과한 적이 없어
//   먼저 검증된 범위만 공개하고, 1년간 피드백을 받으며 넓힙니다.
//   되돌리려면 NHS_OPEN_MAX 숫자만 바꾸면 됩니다(6 = 전부 공개).
function _nhsUser(){
  try { return JSON.parse(localStorage.getItem('hq_user')
                       || sessionStorage.getItem('hq_user') || 'null'); }
  catch(e) { return null; }
}
const NHS_USER = _nhsUser();
const NHS_ROLE = (NHS_USER && NHS_USER.role) || null;
const NHS_IS_MEMBER = ['admin','teacher','student'].indexOf(NHS_ROLE) >= 0;
const NHS_OPEN_MAX = NHS_IS_MEMBER ? 6 : 2;      // 로그인 없이 열리는 최고 레벨
const _lvNum = (name) => ({'Level 1':1,'Level 2':2,'Level 3':3,
                           'Level 4':4,'Level 5':5,'Level 6':6}[name] || 0);

const NHS_TRIAL_ALL_L1 = true;
const NHS_TRIAL_EPS = ['ep01','ep05','ep07'];   // NHS_TRIAL_ALL_L1=false 로 되돌릴 때 쓰는 목록
let L1_EPISODES=[], L2_EPISODES=[], L3_EPISODES=[], L4_EPISODES=[], L5_EPISODES=[], L6_EPISODES=[];
const EPISODES=L1_EPISODES; // 하위호환 — 같은 배열 참조를 유지해야 하므로 재할당(=) 대신 아래에서 push()로 채움
// 에피소드 사이드바 목록은 data/nhs/episodes_index.json에서 fetch — 새 에피소드 추가 시 nhs.html을 건드리지 않아도 됨 (2026-07-04)
const _epIdxReady = fetch('data/nhs/episodes_index.json').then(r=>r.json()).then(d=>{
  L1_EPISODES.push(...(d.L1||[]));
  L2_EPISODES.push(...(d.L2||[]));
  L3_EPISODES.push(...(d.L3||[]));
  L4_EPISODES.push(...(d.L4||[]));
  L5_EPISODES.push(...(d.L5||[]));
  L6_EPISODES.push(...(d.L6||[]));
}).catch(e=>{});

function buildSidebar(lv){
  lv=lv||'L1';
  const _done=_epDoneSet(), _star=_epStarSet();
  const mkItem=(ep,i,level)=>ep.disabled
    ?`<div class="ep-item" style="cursor:default"><div class="ep-num" style="background:var(--warm-300);color:var(--warm-500)">${i+1}</div><div class="ep-name" style="color:var(--warm-300)">${ep.label||'…'}${ep.locked?' 🔒':''}</div></div>`
    :`<div class="ep-item" id="ep-item-${level}-${ep.id}" data-epkey="${level}_${ep.id}" onclick="loadEp('${ep.id}','${level}')"><div class="ep-num">${i+1}</div><div class="ep-name">${ep.tag?`<span class="ep-genre-tag-sm">${esc(ep.tag)}</span>`:''}${ep.label}</div><span class="ep-done" title="${_star.has(level+'_'+ep.id)?'자기점검까지 완료 · Fully reviewed':'Quiz 통과 · Quiz done'}" style="opacity:${(_done.has(level+'_'+ep.id)||_star.has(level+'_'+ep.id))?1:0}">${_star.has(level+'_'+ep.id)?'⭐':'✅'}</span></div>`;
  const trialLock=(list)=>(NHS_IS_TRIAL&&!NHS_TRIAL_ALL_L1)?list.map(ep=>NHS_TRIAL_EPS.includes(ep.id)?ep:{...ep,disabled:true,locked:true}):list;
  let html='';
  if(lv==='L1'){
    html=trialLock(L1_EPISODES).map((ep,i)=>mkItem(ep,i,'L1')).join('');
    html+=(NHS_IS_TRIAL&&!NHS_TRIAL_ALL_L1)
      ?'<div class="lt-item" style="opacity:.4;cursor:default" title="체험판에서는 이용할 수 없어요"><div class="lt-num">🔒</div><div class="lt-name">Level 1 마감 테스트</div></div>'
      :'<div class="lt-item" id="lt-sidebar-item" onclick="loadLevelTest()"><div class="lt-num">🏆</div><div class="lt-name">Level 1 마감 테스트</div></div>';
  }else if(lv==='L2'){
    html=L2_EPISODES.map((ep,i)=>mkItem(ep,i,'L2')).join('')
      +'<div class="lt-item" id="l2t-sidebar-item" onclick="loadL2Test()"><div class="lt-num">🏆</div><div class="lt-name">Level 2 마감 테스트</div></div>';
  }else if(lv==='L3'){
    html=L3_EPISODES.map((ep,i)=>mkItem(ep,i,'L3')).join('')
      +'<div class="lt-item" id="l3t-sidebar-item" onclick="loadL3Test()"><div class="lt-num">🏆</div><div class="lt-name">Level 3 마감 테스트</div></div>';
  }else if(lv==='L4'){
    html=L4_EPISODES.map((ep,i)=>mkItem(ep,i,'L4')).join('')
      +'<div class="lt-item" id="l4t-sidebar-item" onclick="loadL4Test()"><div class="lt-num">🏆</div><div class="lt-name">Level 4 마감 테스트</div></div>';
  }else if(lv==='L5'){
    html=L5_EPISODES.map((ep,i)=>mkItem(ep,i,'L5')).join('')
      +'<div class="lt-item" id="l5t-sidebar-item" onclick="loadL5Test()"><div class="lt-num">🏆</div><div class="lt-name">Level 5 마감 테스트</div></div>';
  }else if(lv==='L6'){
    html=L6_EPISODES.map((ep,i)=>mkItem(ep,i,'L6')).join('')
      +'<div class="lt-item" id="l6t-sidebar-item" onclick="loadL6Test()"><div class="lt-num">🏆</div><div class="lt-name">Level 6 마감 테스트</div></div>';
  }
  document.getElementById('ep-list').innerHTML=html;
}

// ══════════════════════════════════════════════════════
// ── LEVEL 1 TEST ───────────────────────────────────────
// ══════════════════════════════════════════════════════


// ── 🇬🇧 영어 병기 토글 ─────────────────────────────────
//   기본값: L1~L4는 영어 함께 보기 / L5·L6는 한국어 우선(영어 접힘)
//   버튼을 누르면 '그 레벨에 한해서만' 뒤집히고, 그 레벨을 다시 열 때 기억됩니다.
let _enCurLv='L1';
function _enPrefMap(){ try{return JSON.parse(localStorage.getItem('nhs_en_pref_by_level')||'{}');}catch(e){return {};} }
function _enSavePref(lv,off){
  try{ const m=_enPrefMap(); m[lv]=off?'off':'on'; localStorage.setItem('nhs_en_pref_by_level',JSON.stringify(m)); }catch(e){}
}
function _enDefaultFor(lv){ return lv==='L5'||lv==='L6'; }   // true = 한국어 우선
function _enApply(off){
  document.body.classList.toggle('en-off',!!off);
  const b=document.getElementById('en-toggle-btn');
  if(b){
    b.textContent=off?'🇰🇷 KO':'🇬🇧 EN';
    b.title=off?_enCurLv+': 한국어만 보고 있어요 — 누르면 이 레벨에서 영어가 함께 나와요'
                :_enCurLv+': 영어가 함께 나와요 — 누르면 이 레벨에서 한국어만 남아요';
  }
}
function nhsToggleEn(){
  const off=!document.body.classList.contains('en-off');
  _enApply(off);
  _enSavePref(_enCurLv,off);
}
function _enAutoForLevel(lv){
  _enCurLv=lv||'L1';
  const pref=_enPrefMap()[_enCurLv];
  _enApply(pref?pref==='off':_enDefaultFor(_enCurLv));
}

// ── 마감/배치 테스트 오답 복습 링크 ─────────────────────
function _ctTypeLabel(ep){
  if(/^ep\d{2}$/.test(ep||''))return '';
  if((ep||'').startsWith('read'))return '읽기 지문';
  if((ep||'').startsWith('blank'))return '빈칸 채우기';
  if((ep||'').startsWith('sim'))return '심정 추론';
  if((ep||'').startsWith('order'))return '문장 순서 배열';
  return 'TOPIK 유형';
}
function _ctWrongHtml(wrong,level){
  if(!wrong||!wrong.length)
    return `<div style="background:var(--teal-50);border-radius:10px;padding:11px 14px;margin:4px 0 16px;font-size:12.5px;color:var(--teal-dark);font-weight:700">🎉 틀린 문제가 하나도 없어요!</div>`;
  const items=wrong.map(w=>{
    const isEp=/^ep\d{2}$/.test(w.ep||'');
    const q=(w.q||'').replace(/\n/g,' ').replace(/<[^>]+>/g,'').slice(0,46);
    return isEp
      ? `<div class="ct-wrong-item" onclick="loadEp('${w.ep}','${level}')"><span class="ct-wrong-ep">${(w.ep||'').toUpperCase()}</span><span class="ct-wrong-q">${esc(q)}…</span><span class="ct-wrong-go">복습하러 가기 →</span></div>`
      : `<div class="ct-wrong-item ct-wrong-noep"><span class="ct-wrong-ep">${esc(_ctTypeLabel(w.ep))}</span><span class="ct-wrong-q">${esc(q)}…</span></div>`;
  }).join('');
  return `<div style="text-align:left;margin:8px 0 18px">`
    +`<div style="font-size:12.5px;font-weight:800;color:var(--warm-700);margin-bottom:8px">📌 틀린 문제 ${wrong.length}개 — 눌러서 그 편으로 바로 가기</div>`
    +items+`</div>`;
}

let L1Q=[]; const _l1qReady = fetch('data/nhs/L1/closing_test.json').then(r=>r.json()).then(d=>{L1Q=d;}).catch(e=>{});

let ltIdx=0,ltScore=0,ltAnswered=false;
let ltWrong=[];

async function loadLevelTest(){
  await _l1qReady;
  document.querySelectorAll('.ep-item,.lt-item').forEach(el=>el.classList.remove('active'));
  const si=document.getElementById('lt-sidebar-item');
  if(si)si.classList.add('active');
  ltIdx=0;ltScore=0;ltAnswered=false;ltWrong=[];
  document.getElementById('content-area').innerHTML=renderLTPage();
  renderLT();
}
function renderLTPage(){
  return`<div class="lt-page">`
    +`<div class="lt-header">`
      +`<div class="lt-title">🏆 Level 1 마감 테스트</div>`
      +`<div class="lt-subtitle">ep01~ep12 · 전체 복습 · 22문제</div>`
      +`<div class="lt-prog-bar"><div class="lt-prog-fill" id="lt-prog-fill" style="width:0%"></div></div>`
      +`<div class="lt-prog-label" id="lt-prog-label">0 / 20</div>`
    +`</div>`
    +`<div id="lt-q-area"></div>`
  +`</div>`;
}
function renderLT(){
  const q=L1Q[ltIdx];
  const progPct=Math.round(ltIdx/L1Q.length*100);
  const pf=document.getElementById('lt-prog-fill');
  const pl=document.getElementById('lt-prog-label');
  if(pf)pf.style.width=progPct+'%';
  if(pl)pl.textContent=ltIdx+' / '+L1Q.length;
  ltAnswered=false;
  const area=document.getElementById('lt-q-area');
  if(!area)return;
  const listenBtn=q.type==='listen'

function renderPT(){
  const q=PTQ[ptIdx];
  const pf=document.getElementById('pt-prog-fill');
  const pl=document.getElementById('pt-prog-label');
  if(pf)pf.style.width=Math.round(ptIdx/PTQ.length*100)+'%';

  const area=document.getElementById('pt-q-area');
  if(!area)return;
  area.innerHTML=
    `<div class="lt-ep-badge">난이도 ${'●'.repeat(PT_LVS.indexOf(q.lv)+1)}${'○'.repeat(5-PT_LVS.indexOf(q.lv))}</div>`

    +`<div class="lt-q-en">${q.en||''}</div>`

    +`</div><div id="pt-exp-area"></div>`;
}
function ptChoose(idx){
  if(ptAnswered)return;
  ptAnswered=true;
  const q=PTQ[ptIdx];
  const correct=q.ans===idx;
  ptLog.push({lv:q.lv,correct:correct});
  ptStreak=correct?0:ptStreak+1;
  q.opts.forEach((_,i)=>{
    const el=document.getElementById('pt-opt-'+i);
    if(!el)return;
    el.disabled=true;
    if(i===q.ans)el.classList.add('correct');
    else if(i===idx&&!correct)el.classList.add('wrong');
  });
  const last=(ptIdx===PTQ.length-1)||(ptStreak>=2);
  if(ptStreak>=2)ptStopped=true;
  document.getElementById('pt-exp-area').innerHTML=
    `<div class="lt-exp">${correct?'✅':'❌'} ${q.exp||''}</div>`
    +`<button class="lt-next-btn" onclick="ptNext()">${last?'🎯 결과 보기':'다음 →'}</button>`;
}
function ptNext(){
  if(ptStopped||ptIdx>=PTQ.length-1){renderPTScore();return;}
  ptIdx++;
  const pf=document.getElementById('pt-prog-fill');
  const pl=document.getElementById('pt-prog-label');
  if(pf)pf.style.width=Math.round(ptIdx/PTQ.length*100)+'%';
  if(pl)pl.textContent=ptIdx+' / '+PTQ.length;
  renderPT();
}
function renderPTScore(){
  const pf=document.getElementById('pt-prog-fill');
  const pl=document.getElementById('pt-prog-label');
  if(pf)pf.style.width='100%';
  if(pl)pl.textContent=ptLog.length+' / '+PTQ.length;
  const stat={};
  PT_LVS.forEach(l=>stat[l]={a:0,c:0});
  ptLog.forEach(r=>{stat[r.lv].a++;if(r.correct)stat[r.lv].c++;});
  let passed=-1;
  PT_LVS.forEach((l,i)=>{
    const s=stat[l];
    if(s.a>0&&s.c>=Math.ceil(s.a/2))passed=i;
  });
  const startIdx=Math.min(passed+1,PT_LVS.length-1);
  const startLv=PT_LVS[startIdx];
  const startName='Level '+startLv.replace('L','');
  const rows=PT_LVS.map(l=>{
    const s=stat[l];
    if(!s.a)return`<tr><td style="padding:4px 10px;color:var(--warm-400)">${l}</td><td style="padding:4px 10px;color:var(--warm-400)">—</td><td style="padding:4px 10px;color:var(--warm-400)">안 풀었어요</td></tr>`;
    const ok=s.c>=Math.ceil(s.a/2);
    return`<tr><td style="padding:4px 10px;font-weight:700">${l}</td><td style="padding:4px 10px">${s.c} / ${s.a}</td><td style="padding:4px 10px;color:${ok?'var(--teal-dark)':'#c0392b'}">${ok?'통과':'더 연습'}</td></tr>`;
  }).join('');
  const total=ptLog.length,corr=ptLog.filter(r=>r.correct).length;
  _savePlacement(startLv,corr,total);
  const note=ptStopped?'연속으로 두 문제를 틀려서 여기서 마쳤어요. 지금 수준에 딱 맞는 지점을 찾은 거예요!':'끝까지 다 풀었어요!';
  document.getElementById('pt-q-area').innerHTML=
    `<div class="lt-score-wrap">`
    +`<div class="lt-grade" style="color:var(--teal-dark);font-size:34px">${startName}</div>`
    +`<div class="lt-grade-lbl" style="color:var(--teal-dark)">여기서 시작하는 걸 추천해요</div>`
    +`<div class="lt-score-detail">`
      +`<div class="lt-score-box"><div class="lt-score-box-num">${corr}/${total}</div><div class="lt-score-box-lbl">정답</div></div>`
      +`<div class="lt-score-box"><div class="lt-score-box-num">${passed>=0?PT_LVS[passed]:'—'}</div><div class="lt-score-box-lbl">통과 레벨</div></div>`
    +`</div>`
    +`<div style="font-size:12.5px;color:var(--warm-600);margin:12px 0 14px;line-height:1.6;">${note}</div>`
    +`<table style="margin:0 auto 16px;font-size:12.5px;border-collapse:collapse">${rows}</table>`
    +`<div style="font-size:11.5px;color:var(--warm-400);margin-bottom:14px;line-height:1.6">※ 배치 결과는 참고용이에요. 한 레벨 아래에서 시작해 복습하며 올라가도 좋아요.</div>`
    +`<button class="lt-retry-btn" onclick="ptGoLevel('${startName}')" style="background:var(--teal);color:#fff;border-color:var(--teal)">${startName} 시작하기 →</button>`
    +`<button class="lt-retry-btn" onclick="ptRetry()" style="margin-left:8px">↺ 다시 풀기</button>`
    +`</div>`;
}
function ptGoLevel(name){

}




async function _doLoadEp(epId, level='L1'){
  await Promise.all([_rdPoolReady, _spPoolReady, _sharedSetsReady, _wrPoolReady]);
  document.querySelectorAll('.ep-item').forEach(el=>el.classList.remove('active'));
  const item=document.getElementById(`ep-item-${level}-${epId}`);
  if(item)item.classList.add('active');
  document.getElementById('content-area').innerHTML='<div class="loading">로딩 중…</div>';
  Object.keys(rlAnswered).forEach(k=>delete rlAnswered[k]);
  const cacheKey=`${level}_${epId}`;
  if(EPISODE_DATA[cacheKey]){
    DATA=EPISODE_DATA[cacheKey];
  } else {
    try{
      const res=await fetch(`data/nhs/${level}/${epId}.json`);
      if(res.ok){ DATA=await res.json(); _resolveRefs(DATA); EPISODE_DATA[cacheKey]=DATA; }
      else DATA=null;
    }catch(e){ DATA=null; }
  }
  if(!DATA){
    document.getElementById('content-area').innerHTML='<div class="loading">⚠️ 에피소드 데이터가 없어요.</div>';
    return;
  }
  // Preload: wait for first slide, then render; load rest async
  if(DATA.slides&&DATA.slides.length){
    await Promise.race([
      new Promise(res=>{const img=new Image();img.onload=img.onerror=res;img.src=encodeURI(DATA.slides[0]);if(img.complete)res();}),
      new Promise(res=>setTimeout(res,600))
    ]);
    DATA.slides.slice(1).forEach(s=>{const img=new Image();img.src=encodeURI(s);});
  }
  qAnswered={};curTab='script';sceneIdx=0;render();
}

function buildAnnoText(text, anno){
  if(!anno||!anno.highlight) return esc(text);
  const idx=text.indexOf(anno.highlight);
  if(idx<0) return esc(text);
  if(!anno.note&&!anno.grammar){
    return esc(text.slice(0,idx))+'<span class="anno-hl">'+esc(anno.highlight)+'</span>'+esc(text.slice(idx+anno.highlight.length));
  }
  return esc(text.slice(0,idx))
    +'<span class="anno-mark" data-grammar="'+esc(anno.grammar||'')+'" data-note="'+esc(anno.note||'')+'" onclick="showAnnoTooltipEl(event,this)" onmouseleave="hideAnnoTooltip()" title="'+esc(anno.grammar||'')+'">'+esc(anno.highlight)+' 📎</span>'
    +esc(text.slice(idx+anno.highlight.length));
}
// 여러 개 인라인 주석 (문학 편 어려운 어휘 풀이용)
function buildAnnoTextMulti(text, annos){
  if(!annos||!annos.length) return esc(text);
  let marks=[];
  annos.forEach(a=>{ if(a&&a.highlight){ const idx=text.indexOf(a.highlight); if(idx>=0) marks.push({idx:idx,len:a.highlight.length,hl:a.highlight,note:a.note||'',grammar:a.grammar||''}); } });
  if(!marks.length) return esc(text);
  marks.sort((x,y)=>x.idx-y.idx);
  let filtered=[],lastEnd=-1;
  marks.forEach(m=>{ if(m.idx>=lastEnd){ filtered.push(m); lastEnd=m.idx+m.len; } });
  let out='',cur=0;
  filtered.forEach(m=>{
    out+=esc(text.slice(cur,m.idx));
    if(m.note||m.grammar){
      out+='<span class="anno-mark" data-grammar="'+esc(m.grammar)+'" data-note="'+esc(m.note)+'" onclick="showAnnoTooltipEl(event,this)" onmouseleave="hideAnnoTooltip()" title="'+esc(m.grammar)+'">'+esc(m.hl)+' 📎</span>';
    } else {
      out+='<span class="anno-hl">'+esc(m.hl)+'</span>';
    }
    cur=m.idx+m.len;
  });
  out+=esc(text.slice(cur));
  return out;
}
function showAnnoTooltip(e,grammar,note){
  document.querySelectorAll('.anno-tooltip').forEach(t=>t.remove());
  const tip=document.createElement('div');
  tip.className='anno-tooltip';
  tip.innerHTML='<div class="anno-tooltip-tag">'+esc(grammar)+'</div><div class="anno-tooltip-note">'+esc(note)+'</div>';
  document.body.appendChild(tip);
  const x=Math.min(e.clientX+8, window.innerWidth-290);
  const y=Math.min(e.clientY+14, window.innerHeight-120);
  tip.style.left=x+'px'; tip.style.top=y+'px';
  e.stopPropagation();
  // 클릭 외부 or 같은 요소 재클릭 시 제거
  const remove=()=>{tip.remove();document.removeEventListener('click',remove);};
  setTimeout(()=>document.addEventListener('click',remove),50);
}

function hideAnnoTooltip(){
  document.querySelectorAll('.anno-tooltip').forEach(t=>t.remove());
}
function showAnnoTooltipEl(e,el){
  const grammar=el.dataset.grammar||'';

function renderScene(){
  const panel=document.getElementById('scene-panel');
  if(!panel)return;
  const line=DATA.script[sceneIdx];
  const slideIdx=(line.slide!=null)?line.slide:sceneIdx;
  const src=DATA.slides&&DATA.slides[slideIdx]?DATA.slides[slideIdx]:(DATA.slides&&DATA.slides[0])||'';
  const encodedSrc=src?encodeURI(src):'';
  panel.style.backgroundImage=encodedSrc?`url('${encodedSrc}')`:'none';
  // Ensure panel refreshes once image is fully loaded (handles first-visit cache miss)
  // Fix: same-URL set doesn't trigger repaint → clear first then rAF; also handle img.complete case
  if(encodedSrc){const _img=new Image();const _si=sceneIdx;const _refresh=()=>{if(sceneIdx===_si&&panel.isConnected){panel.style.backgroundImage='none';void panel.offsetHeight;panel.style.backgroundImage=`url('${encodedSrc}')`;}};_img.onload=_refresh;_img.src=encodedSrc;if(_img.complete)_refresh();}
  const charMap={};DATA.characters.forEach(c=>{charMap[c.id]=c;});
  const ch=charMap[line.speaker]||{name:line.speaker};
  const cfg_def=CHAR_CFG[line.speaker]||CHAR_CFG.narrator;
  const cfg={bg:ch.color||cfg_def.bg,emoji:ch.emoji||cfg_def.emoji};
  const tagHtml=line.speech_type&&line.speech_type!=='narrator'?`<span class="caption-tag ${line.speech_type==='반말'?'tag-banmal':'tag-jondaemal'}">${line.speech_type}</span>`:'';
  document.getElementById('scene-caption').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="caption-avatar" style="background:${cfg.bg}">${cfg.emoji}</div>
      <div class="caption-name">${esc(ch.name)}</div>
    </div>
    <div class="caption-body" style="flex:1">
      <div class="caption-kr">${(line.annotations?buildAnnoTextMulti(line.text,line.annotations):buildAnnoText(line.text, line.annotation))}</div>
      <div class="caption-en">${esc(line.en||line.translation||'')}</div>
      ${tagHtml}

    </div>
`;
  const total=DATA.script.length;
  document.getElementById('nav-steps').innerHTML=DATA.script.map((_,i)=>`<div class="nav-step${i<=sceneIdx?' done':''}"></div>`).join('');
  document.getElementById('nav-count').textContent=`${sceneIdx+1} / ${total}`;
  document.getElementById('nav-prev').disabled=sceneIdx===0;
  document.getElementById('nav-next').disabled=sceneIdx===total-1;
  const sb=document.getElementById('speak-btn');
  if(sb){nhsRecCleanup();sb.textContent='🎙️';sb.title='따라녹음하기';sb.classList.remove('listening','rec-on');sb.classList.add('rec-done');sb.disabled=false;}
  nhsShadStop();
  const _sr=document.getElementById('shad-result');if(_sr){_sr.style.display='none';_sr.innerHTML='';}
  updateStripHighlight();
}

function moveScene(dir){
  const next=sceneIdx+dir;
  if(next<0||next>=DATA.script.length)return;
  sceneIdx=next;renderScene();
}

function jumpScene(i){
  sceneIdx=i;renderScene();
}

function speakCurrent(){
  if(!DATA)return;
  const line=DATA.script[sceneIdx];speak(line.text,line.audio);
}

function randomScene(){
  const total=DATA.script.length;
  let next;
  do{next=Math.floor(Math.random()*total);}while(next===sceneIdx&&total>1);
  sceneIdx=next;renderScene();
}

function toggleStrip(){
  const strip=document.getElementById('script-strip');
  const btn=document.getElementById('strip-toggle-btn');
  const isOpen=strip.classList.toggle('open');
  if(btn){isOpen?btn.classList.add('open'):btn.classList.remove('open');}
  if(isOpen&&!strip.innerHTML)buildStrip();
}

function buildStrip(){
  const strip=document.getElementById('script-strip');
  if(!strip)return;
  strip.innerHTML=DATA.script.map((line,i)=>{
    const cfg=CHAR_CFG[line.speaker]||CHAR_CFG.narrator;
    const _sShadEsc=line.text.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<div class="strip-row${i===sceneIdx?' current':''}">
      <div class="strip-avatar" onclick="jumpScene(${i});updateStripHighlight()">${cfg.emoji}</div>
      <div style="flex:1;min-width:0;" onclick="jumpScene(${i});updateStripHighlight()"><div class="strip-kr">${esc(line.text)}</div><div class="strip-en">${esc(line.en||line.translation||'')}</div></div>
      <button class="shad-strip-btn" id="shad-s${i}" data-target="${_sShadEsc}" data-idx="${i}" onclick="nhsShadLine(event,this.dataset.target,parseInt(this.dataset.idx))" title="따라 말하기">🎤</button>
    </div><div class="shad-strip-result" id="shad-sr${i}"></div>`;
  }).join('');

      <summary class="script-trans-sum">📄 번역 보기 · Translations <span style="font-size:10.5px;color:var(--warm-400);font-weight:400">(먼저 한국어로 읽어 보세요)</span></summary>
      <ol class="script-trans-list">${_tr.map(l=>`<li>${esc(l.en||l.translation||'')}</li>`).join('')}</ol>

function updateStripHighlight(){
  document.querySelectorAll('.strip-row').forEach((el,i)=>el.classList.toggle('current',i===sceneIdx));

// ── AUDIO ──────────────────────────────────────────────
function speak(text,audioSrc){
  if(audioSrc){
    if(_audio){_audio.pause();_audio=null;}
    _audio=new Audio(audioSrc);
    _audio.play().catch(()=>speakTTS(text));
  }else{
    speakTTS(text);
  }
}
// ── AUTO-PLAY ───────────────────────────────────────────
let _autoPlay=false,_apTimer=null;

function autoPlayToggle(){
  if(_autoPlay){autoPlayStop();return;}
  _autoPlay=true;
  const btn=document.getElementById('ap-btn');
  if(btn){btn.textContent='⏹ Stop';btn.style.background='var(--coral)';}
  autoPlayStep();
}

function autoPlayStop(){
  _autoPlay=false;
  if(_apTimer){clearTimeout(_apTimer);_apTimer=null;}
  if(_audio){_audio.pause();_audio=null;}
  if(window.speechSynthesis)speechSynthesis.cancel();
  const btn=document.getElementById('ap-btn');
  if(btn){btn.textContent='▶▶ Auto-play';btn.style.background='var(--teal)';}
}

function autoPlayStep(){
  if(!_autoPlay||!DATA)return;
  const line=DATA.script[sceneIdx];
  const total=DATA.script.length;
  const onEnd=()=>{
    if(!_autoPlay)return;
    if(sceneIdx>=total-1){autoPlayStop();return;}
    _apTimer=setTimeout(()=>{if(!_autoPlay)return;moveScene(1);autoPlayStep();},700);
  };
  if(line.audio){
    if(_audio){_audio.pause();_audio=null;}
    _audio=new Audio(line.audio);
    _audio.onended=onEnd;
    _audio.play().catch(()=>_apTTS(line.text,onEnd));
  }else{
    _apTTS(line.text,onEnd);
  }
}

function _apTTS(text,onEnd){
  if(!window.speechSynthesis){onEnd();return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR';u.rate=0.88;u.onend=onEnd;
  const go=()=>{const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));const pref=vs.find(v=>/google|yuna|heami|sora|microsoft|natural|neural|siri/i.test(v.name))||vs[0];if(pref)u.voice=pref;speechSynthesis.speak(u);};
  speechSynthesis.getVoices().length?go():(speechSynthesis.onvoiceschanged=()=>{go();speechSynthesis.onvoiceschanged=null;});
}

function speakTTS(text){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR';u.rate=0.88;
  const go=()=>{const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));const pref=vs.find(v=>/google|yuna|heami|sora|microsoft|natural|neural|siri/i.test(v.name))||vs[0];if(pref)u.voice=pref;speechSynthesis.speak(u);};
  speechSynthesis.getVoices().length?go():(speechSynthesis.onvoiceschanged=()=>{go();speechSynthesis.onvoiceschanged=null;});
}
function stopTTS(){ if(window.speechSynthesis) speechSynthesis.cancel(); if(_audio){_audio.pause();_audio=null;} }
// Real Life 전용 재생: 미리 만든 Typecast mp3(audio)가 있으면 그걸 재생하고, 없거나 재생 실패하면 브라우저 TTS로 대체
function rlPlay(src,text){
  if(_audio){_audio.pause();_audio=null;}
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(src){
    _audio=new Audio(src);
    _audio.play().catch(()=>{_audio=null;speakTTS(text);});
  } else {
    speakTTS(text);
  }
}

// ── FILL IN THE BLANKS CHECK ───────────────────────────
function checkFill(id){
  const container=document.getElementById(id);
  if(!container)return;
  const inputs=container.querySelectorAll('.gram-blank');
  let correct=0;
  inputs.forEach(inp=>{
    const ans=(inp.dataset.answer||'').trim();
    const val=inp.value.trim();
    if(val===ans){inp.style.borderBottomColor='#16A34A';inp.style.color='#16A34A';correct++;}
    else{inp.style.borderBottomColor='#E74C3C';inp.style.color='#E74C3C';}
  });
  const res=document.getElementById(id+'-res');
  if(res){
    res.textContent=correct===inputs.length?`${correct}/${inputs.length} 🎉 완벽해요!`:`${correct}/${inputs.length} 다시 해봐요 😊`;
    res.className='gram-fill-result '+(correct===inputs.length?'ok':'ng');
  }
}

function _gramExampleList(g){
  // 문법카드의 예문은 두 스키마 중 하나에 들어있음: 단순형(examples 배열) 또는
  // 규칙별로 묶인 그룹형(example_groups[].items). 둘 다 합쳐서 반환.
  const out=[];
  (g.examples||[]).forEach(ex=>{ if(ex&&ex.ko) out.push(ex); });
  (g.example_groups||[]).forEach(grp=>{
    (grp.items||[]).forEach(it=>{ if(it&&it.ko) out.push(it); });
  });
  return out;
}
function _buildQuizTabBar(){
  const epKey=`${DATA.level}_${DATA.id}`;

  const hasWr=(_lvN>=3&&DATA.script&&DATA.script.length>0)||!!(WRITING_POOL[epKey]);
  const hasSpk=!!((WRITING_POOL[epKey]&&(WRITING_POOL[epKey].completion||[]).length)||(DATA.real_life||[]).some(it=>it&&it.type==='writing_guided'));

function buildQuiz(){

function renderQuizQ(){
  const total=DATA.quiz.length;

  // 각 문항의 type 자동 판별:
  // - audio_text 있음 → 듣기 형식 (🔊 버튼 + 선택지)

  const isListen = !!q.audio_text;

  const optsEn=q.options_en||q.choices_en||null;
  const opts=(q.options||q.choices||[]).map((opt,oi)=>`
    <button class="quiz-opt" id="qopt-${oi}" onclick="answerMC(${oi},${qi})">
      <span style="font-weight:700;color:var(--teal-md);margin-right:7px">${oi+1}.</span>${esc(opt)}${optsEn&&optsEn[oi]?`<div style="font-size:11px;color:var(--warm-500);font-weight:400;margin-top:2px;margin-left:20px;">${esc(optsEn[oi])}</div>`:''}
    </button>`).join('');

  let inner='';
  if(isListen){
    inner=`<div class="quiz-listen-wrap" style="margin-bottom:18px;">
        <div style="font-size:12px;color:var(--teal);margin-bottom:10px">🔊 음성을 듣고 맞는 답을 고르세요 · Listen and choose</div>
        <button class="quiz-listen-btn" onclick="speakTTS('${escA(q.audio_text)}')">🔊 듣기 Listen</button>
      </div>
      <div class="quiz-opts">${opts}</div>
      <div class="quiz-exp" id="quiz-exp"></div>
      <button class="quiz-next-btn" id="quiz-next" onclick="nextQuizQ()">${qi+1<total?'다음 문제 → Next':'결과 보기 🎉 Results'}</button>`;
  } else {
    inner=`<div class="quiz-opts">${opts}</div>
      <div class="quiz-exp" id="quiz-exp"></div>
      <button class="quiz-next-btn" id="quiz-next" onclick="nextQuizQ()">${qi+1<total?'다음 문제 → Next':'결과 보기 🎉 Results'}</button>`;
  }

  // 질문 표시: listen은 지시문 작게 (음성 듣기가 메인), mc는 질문 메인
  const qTextStyle = isListen ? 'font-size:12px;color:var(--warm-400);margin-bottom:4px;' : 'margin-bottom:4px;';
  const qEnHtml = (!isListen && q.question_en)
    ? `<div class="quiz-q-en">${esc(q.question_en)}</div>` : '';

  document.getElementById('quiz-content').innerHTML=`

      <div class="quiz-q-num">문제 ${qi+1}</div>
      <div class="quiz-q-text" style="${qTextStyle}">${esc(q.question_ko||q.question||'')}</div>
      ${qEnHtml}
      ${inner}
    </div>`;

function answerMC(chosen,qi){
  const q=DATA.quiz[qi];
  const correct=q.answer;
  const hint=q.explanation||'';
  for(let i=0;i<10;i++){
    const el=document.getElementById(`qopt-${i}`);
    if(!el)break;
    el.classList.add('locked');
    if(i===correct)el.classList.add('correct');
    else if(i===chosen)el.classList.add('wrong');
  }
  if(chosen===correct)quizScore++;
  showQuizExp(hint);
}
function checkWriteAnswer(qi){
  const q=DATA.quiz[qi];
  const correctText=q.audio_text||(q.options||[])[q.answer]||'';
  const hint=q.explanation||'';
  const input=document.getElementById('quiz-write-input');
  if(!input)return;
  const val=(input.value||'').trim().replace(/\s+/g,' ');
  const exp=correctText.trim().replace(/\s+/g,' ');
  const ok=val===exp||(val&&exp&&exp.includes(val))||val.toLowerCase()===exp.toLowerCase();
  input.disabled=true;
  input.style.borderColor=ok?'var(--teal-md)':'var(--coral)';
  input.style.background=ok?'#EDF7F2':'#FFF0F0';
  if(ok)quizScore++;
  const fullHint=(ok?'✅ 정답! ':'❌ 오답. 정답: '+correctText+'\n')+hint;
  showQuizExp(fullHint);
}
function showQuizExp(hint){
  const exp=document.getElementById('quiz-exp');
  const btn=document.getElementById('quiz-next');
  if(exp&&hint){exp.textContent='💡 '+hint;exp.classList.add('show');}
  if(btn)btn.classList.add('show');
}
function nextQuizQ(){
  quizIdx++;
  renderQuizQ();
}
function renderQuizScore(){

  const epKey=`${DATA.level}_${DATA.id}`;
  const rdPool=READING_POOL[epKey]||null;

  // ── Progress tracking ──
  _markEpDone(`${DATA.level}_${DATA.id}`);
  const _hasProfile=!!_progOwner();
  const _profileNudge=_hasProfile?'':'<div style="font-size:12px;color:var(--warm-400);margin-top:12px;">💡 My Notes 프로필을 만들면 진도가 저장돼요!</div>';
  document.getElementById('quiz-content').innerHTML=`
    <div class="quiz-score-wrap">
      <div class="quiz-score-num">${quizScore}<span style="font-size:24px;color:var(--warm-500)">/${total}</span></div>
      <div class="quiz-score-lbl">${msg}</div>
      <div style="font-size:13px;color:var(--warm-500);margin-top:8px">${pct}% 정답</div>

    </div>${rdSection}${spSection}`;
  if(rdPool){ _rdPool=rdPool; _rdQIdx=0; _rdAnswered=0; _rdRender(); }

}
function setQuizMode(mode){
  quizMode=mode;
  quizIdx=0;quizScore=0;
  const epKey=`${DATA.level}_${DATA.id}`;
  const panel=document.getElementById('panel-quiz');
  if(mode==='sentbuild'){
    panel.innerHTML=`<div style="max-width:580px">${_buildQuizTabBar()}<div id="sb-wrap" style="margin-top:4px;"></div></div>`;
    _sbInit();
  } else if(mode==='reading'){
    const rdPool=READING_POOL[epKey]||null;
    if(!rdPool){panel.innerHTML='<div class="loading">읽기 데이터가 없어요.</div>';return;}
    panel.innerHTML=`<div style="max-width:580px">${_buildQuizTabBar()}<div id="rd-wrap" style="margin-top:4px;"></div></div>`;
    _rdPool=rdPool;_rdQIdx=0;_rdAnswered=0;_rdRender();
  } else if(mode==='spacing'){
    const spPool=SP_QUIZ_POOL[epKey]||null;
    if(!spPool){panel.innerHTML='<div class="loading">띄어쓰기 데이터가 없어요.</div>';return;}
    panel.innerHTML=`<div style="max-width:580px">${_buildQuizTabBar()}<div id="spq-wrap" style="margin-top:4px;"></div></div>`;
    _spqPool=spPool;_spqIdx=0;_spqClicked=[];_spqRender();
  } else if(mode==='writing'){
    panel.innerHTML=`<div style="max-width:580px">${_buildQuizTabBar()}<div style="margin-top:4px;">${buildWriteTab()}</div></div>`;
  } else if(mode==='speaking'){
    panel.innerHTML=`<div style="max-width:580px">${_buildQuizTabBar()}<div style="margin-top:4px;">${buildSpeakTab()}</div></div>`;
  } else {

function resetQuiz(){

}

// ── SENTENCE BUILDER (🧩 문장 만들기) ────────────────────
// 새 콘텐츠 작성 없이 그 편 grammar[].examples(ko/en)를 그대로 재사용해 단어 순서 맞추기 게임을 만듦.
// 1단계 = 덩어리 낱말(조사 붙은 채로), 2단계 = 조사 분리 + 오답 조사(distractor) 포함, sentbuild2_pool.json에서 로드.
let _sbPool=[], _sbPool2=[], _sbStage=1, _sbIdx=0, _sbDone=[], _sbDone2=[];
function _sbInit(){
  const pool=[]; const seen=new Set();
  (DATA.grammar||[]).forEach(g=>{
    _gramExampleList(g).forEach(ex=>{
      const ko=(ex&&ex.ko||'').trim();
      if(ko&&ko.split(/\s+/).length>=2&&!seen.has(ko)){ seen.add(ko); pool.push({ko,en:ex.en||''}); }
    });
  });
  const epKey=`${DATA.level}_${DATA.id}`;
  _sbPool=pool; _sbPool2=SENTBUILD2_POOL[epKey]||[];
  _sbStage=1; _sbIdx=0; _sbDone=new Array(pool.length).fill(false); _sbDone2=new Array(_sbPool2.length).fill(false);

}

function _sbCurDone(){ return _sbStage===2?_sbDone2:_sbDone; }
function _sbTiles(item){ return _sbStage===2?[...item.target,...(item.distractors||[])]:item.ko.split(/\s+/); }

function _sbMove(tile){

function _sbCheck(){
  const ansEl=document.getElementById('sb-answer');
  const placed=Array.from(ansEl.querySelectorAll('.sb-tile')).map(el=>el.textContent);
  const set=_sbCurSet(), done=_sbCurDone();

  const nextBtn=document.getElementById('sb-next-btn');
  if(!fb||!btn)return;

  const ansEl=document.getElementById('sb-answer');
  const fb=document.getElementById('sb-fb');
  const btn=document.getElementById('sb-check-btn');
  const nextBtn=document.getElementById('sb-next-btn');

  Array.from(ansEl.querySelectorAll('.sb-tile')).forEach(tile=>{
    tile.style.background='#fff';tile.style.color='';tile.style.borderColor='var(--warm-300)';

  ansEl.innerHTML='<span style="color:var(--warm-500);font-size:12.5px;">여기에 순서대로 놓으세요 · Place words here in order</span>';

let SHARED_SETS = {}; const _sharedSetsReady = fetch('data/nhs/shared_expression_sets.json').then(r=>r.json()).then(d=>{SHARED_SETS=d;}).catch(e=>{});
// 여러 에피소드가 재사용하는 표현 세트({"ref":"set_name"}) 해석 — vocab/usage 배열 안에서 ref 항목을 실제 데이터로 치환
function _resolveRefs(data){
  if(!data) return data;
  ['vocab','usage'].forEach(key=>{
    if(Array.isArray(data[key])){
      data[key]=data[key].flatMap(entry=>{
        if(entry&&entry.ref){
          const shared=SHARED_SETS[entry.ref];
          return (shared&&shared[key])?[shared[key]]:[];
        }
        return [entry];
      });
    }
  });
  return data;
}

  const items=Array.isArray(_pron)?_pron:[];
  if(!items.length){
    // 문법에서 발음·불규칙 관련 자동 추출

    return`<div style="font-size:12px;color:var(--warm-500);margin-bottom:12px">📌 문법에서 발음·불규칙 관련 항목을 자동으로 가져왔어요</div>`+
      auto.map(g=>`<div class="gram-card">

        ${g.rule?`<div class="gram-rule">📐 ${esc(g.rule)}</div>`:''}
        <ul class="gram-ex-list">${(g.examples||[]).slice(0,3).map(ex=>`<li class="gram-ex">
          <div class="gram-ko">${esc(ex.ko)} <button onclick="speakTTS('${escA(ex.ko)}')" style="background:none;border:none;cursor:pointer;font-size:12px;opacity:.5">🔊</button></div>
          <div class="gram-en">${esc(ex.en)}</div></li>`).join('')}</ul>
      </div>`).join('');
  }
  return items.map(item=>{
    // 세종 스타일 테이블 (선택적)
    const pronTableHtml=item.table?`<div class="gram-table-wrap" style="margin-top:10px"><table class="gram-table">
      <thead><tr>${(item.table.columns||[]).map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${(item.table.rows||[]).map(r=>`<tr>${r.map((cell,ci)=>
        ci===1
          ? `<td><span style="font-family:var(--font-serif);font-weight:700;color:var(--coral)">${esc(cell)}</span> <button onclick="speakTTS('${escA(cell.replace(/[\[\]]/g,''))}')" style="background:none;border:none;cursor:pointer;font-size:12px;opacity:.5">🔊</button></td>`
          : ci===2
            ? `<td style="color:var(--blue);font-weight:600">${esc(cell)}</td>`
            : `<td style="font-family:var(--font-serif);font-weight:700">${esc(cell)}</td>`
      ).join('')}</tr>`).join('')}</tbody>
    </table></div>`:'';
    // 기존 before→after 예문 (선택적)
    const pronExHtml=(item.examples||[]).map(ex=>{
      const written=ex.written||ex.before||ex.ko||'';
      const hasCompare=ex.pronounced_standard||ex.pronounced_actual;
      if(hasCompare){
        const std=ex.pronounced_standard||'';
        const act=ex.pronounced_actual||'';
        const same=std===act;
        return`<div class="pron-ex">
          <div class="pron-before">${esc(written)}</div>
          <div class="pron-arrow">→</div>
          <div style="flex:1">
            ${same
              ? `<div class="pron-after">${esc(std)} <button onclick="speakTTS('${escA(std.replace(/[\[\]]/g,''))}')" style="background:none;border:none;font-size:12px;cursor:pointer;opacity:.5">🔊</button></div>`
              : `<div style="display:flex;flex-direction:column;gap:4px">
                  <div style="display:flex;align-items:center;gap:6px">
                    <span style="font-size:10px;font-weight:700;color:var(--teal);min-width:44px">🎓 표준</span>
                    <span class="pron-after" style="margin:0">${esc(std)}</span>
                    <button onclick="speakTTS('${escA(std.replace(/[\[\]]/g,''))}')" style="background:none;border:none;font-size:12px;cursor:pointer;opacity:.5">🔊</button>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px">
                    <span style="font-size:10px;font-weight:700;color:var(--coral);min-width:44px">🗣️ 실제</span>
                    <span class="pron-after" style="margin:0;color:var(--coral)">${esc(act)}</span>
                    <button onclick="speakTTS('${escA(act.replace(/[\[\]]/g,''))}')" style="background:none;border:none;font-size:12px;cursor:pointer;opacity:.5">🔊</button>
                  </div>
                </div>`
            }
            <div class="pron-note">${esc(ex.note||'')}</div>
          </div>
        </div>`;
      }
      return`<div class="pron-ex">
        <div class="pron-before">${esc(written)}</div>
        <div class="pron-arrow">→</div>
        <div class="pron-after">${esc(ex.after||ex.pronounced||'')} <button onclick="speakTTS('${escA((ex.after||ex.pronounced||'').replace(/[\[\]]/g,''))}')" style="background:none;border:none;font-size:12px;cursor:pointer;opacity:.5">🔊</button></div>
        <div class="pron-note">${esc(ex.note||ex.en||'')}</div>
      </div>`;
    }).join('');
    return`<div class="pron-card">
      <div class="pron-title">${esc(item.title||'')} ${item.icon||''}</div>
      <div class="pron-rule">${esc(item.rule||'')}</div>
      ${pronTableHtml}
      ${pronExHtml}
      ${item.tip?`<div style="margin-top:12px;background:var(--amber-lt);border-radius:var(--radius-sm);padding:9px 13px;font-size:12px;color:var(--warm-700)">💡 ${esc(item.tip)}</div>`:''}
    </div>`;
  }).join('');
}

// ── USAGE ──────────────────────────────────────────────
function buildUsage(){
  let usage=DATA.usage;
  if(!usage)return'<div class="loading">데이터 준비 중이에요.</div>';
  if(!Array.isArray(usage)&&usage.sections){usage=usage.sections;}
  if(!Array.isArray(usage)||!usage.length)return'<div class="loading">데이터 준비 중이에요.</div>';
  return usage.map(sec=>{
    if(sec.type==='tip')return`<div style="background:var(--amber-lt);border:1.5px solid #F0C980;border-radius:var(--radius-md);padding:13px 17px;font-size:13px;color:var(--warm-900);line-height:1.75;margin-bottom:14px"><strong>${esc(sec.section||sec.title||'')}</strong><br>${esc(sec.content_ko||sec.content||'')}<div style="font-size:11px;color:var(--warm-500);margin-top:6px">${esc(sec.content_en||'')}</div></div>`;
    if(sec.heading){
      const exHtml=(sec.examples||[]).map(ex=>`
        <div style="background:#fff;border-radius:var(--radius-sm);border:1px solid var(--warm-300);padding:10px 14px;margin-bottom:6px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-sm)">
          <div style="flex:1"><div style="font-family:var(--font-serif);font-size:14px;font-weight:700;color:var(--warm-900)">${esc(ex.ko)}</div><div style="font-size:11px;color:var(--warm-500);margin-top:2px">${esc(ex.en)}</div></div>
          <button onclick="speakTTS('${escA(ex.ko)}')" style="background:none;border:none;font-size:15px;cursor:pointer;opacity:.5">🔊</button>
        </div>`).join('');
      return`<div style="margin-bottom:22px">
        <div style="font-size:12.5px;font-weight:700;color:var(--teal);margin-bottom:6px;padding-bottom:6px;border-bottom:2px solid var(--teal-lt)">${esc(sec.heading)}</div>
        ${sec.content?`<div style="font-size:12px;color:var(--warm-700);line-height:1.7;margin-bottom:10px">${esc(sec.content)}</div>`:''}
        ${exHtml}
      </div>`;
    }
    if(sec.title&&sec.explanation_en){
      const exHtml=(sec.examples||[]).map(ex=>`
        <div style="background:#fff;border-radius:var(--radius-sm);border:1px solid var(--warm-300);padding:10px 14px;margin-bottom:6px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-sm)">
          <div style="flex:1"><div style="font-family:var(--font-serif);font-size:14px;font-weight:700;color:var(--warm-900)">${esc(ex.ko)}</div><div style="font-size:11px;color:var(--warm-500);margin-top:2px">${esc(ex.en)}</div></div>
          <button onclick="speakTTS('${escA(ex.ko)}')" style="background:none;border:none;font-size:15px;cursor:pointer;opacity:.5">🔊</button>
        </div>`).join('');
      return`<div style="margin-bottom:22px">
        <div style="font-size:12.5px;font-weight:700;color:var(--teal);margin-bottom:6px;padding-bottom:6px;border-bottom:2px solid var(--teal-lt)">${esc(sec.title)}</div>
        <div class="en-gloss" style="font-size:12px;color:var(--warm-700);line-height:1.7;margin-bottom:10px">${esc(sec.explanation_en)}</div>
        ${exHtml}
      </div>`;
    }
    // old format: section + items[] — supports ko/en OR korean/english fields
    const itemHtml=(sec.items||[]).map(it=>{
      const kr=it.ko||it.korean||'';
      const en=it.en||it.english||'';
      const ctx=it.context_ko||'';
      return`<div style="background:#fff;border-radius:var(--radius-sm);border:1px solid var(--warm-300);padding:10px 14px;margin-bottom:6px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-sm)">
        <div style="flex:1">
          ${ctx?`<div style="font-size:10.5px;color:var(--teal-md);font-weight:700;margin-bottom:3px">${esc(ctx)}</div>`:''}
          <div style="font-family:var(--font-serif);font-size:14px;font-weight:700;color:var(--warm-900)">${esc(kr)}</div>
          <div style="font-size:11px;color:var(--warm-500);margin-top:2px">${esc(en)}</div>
          ${it.note?`<div style="font-size:10.5px;color:var(--teal-md);margin-top:3px;font-style:italic">${esc(it.note)}</div>`:''}
        </div>
        <button onclick="speakTTS('${escA(kr)}')" style="background:none;border:none;font-size:15px;cursor:pointer;opacity:.5">🔊</button>
      </div>`;
    }).join('');
    return`<div style="margin-bottom:22px">
      <div style="font-size:12.5px;font-weight:700;color:var(--teal);margin-bottom:6px;padding-bottom:6px;border-bottom:2px solid var(--teal-lt)">${esc(sec.section||sec.title||'')}</div>
      ${itemHtml}
    </div>`;
  }).join('');
}

// Real Life comprehension quiz helper
const rlAnswered={};
function buildRLQuiz(questions,prefix){
  if(!questions||!questions.length)return'';
  return`<div style="margin-top:12px">${questions.map((q,i)=>{
    const key=`${prefix}_${i}`;
    const opts=(q.options||[]).map((opt,oi)=>`
      <li id="rlopt-${key}-${oi}" onclick="answerRL('${key}',${i},${oi},${q.answer},'${escA(q.explanation||'')}','${prefix}')"
          style="list-style:none;padding:8px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--warm-300);margin-bottom:5px;cursor:pointer;font-size:12.5px;transition:background .15s">
        <span style="font-weight:700;color:var(--teal-md);margin-right:6px">${oi+1}.</span>${esc(opt)}
      </li>`).join('');
    return`<div style="margin-bottom:14px">
      <div style="font-size:12.5px;font-weight:700;color:var(--warm-900);margin-bottom:6px">${i+1}. ${esc(q.question_ko||q.question||'')}</div>
      ${q.question_en?`<div style="font-size:11px;color:var(--warm-500);margin-bottom:6px">${esc(q.question_en)}</div>`:''}
      <ul style="padding:0;margin:0">${opts}</ul>
      <div id="rlexp-${key}" style="font-size:12px;color:var(--sage);padding:8px 12px;background:#EDF7F2;border-radius:var(--radius-sm);display:none"></div>
    </div>`;
  }).join('')}</div>`;
}
function answerRL(key,qi,chosen,correct,hint,prefix){
  if(rlAnswered[`${key}`])return;
  rlAnswered[`${key}`]=true;
  const isCorrect=(chosen===correct);
  for(let i=0;i<10;i++){
    const el=document.getElementById(`rlopt-${key}-${i}`);
    if(!el)break;
    el.style.pointerEvents='none';
    if(i===correct){
      el.style.background='#D4F5E2';el.style.border='2px solid #2ECC71';
      el.style.fontWeight='700';
      const mk=document.createElement('span');mk.textContent=' ✓';mk.style.color='#27AE60';mk.style.fontWeight='900';el.appendChild(mk);
    } else if(i===chosen){
      el.style.background='#FDDEDE';el.style.border='2px solid #E74C3C';
      const xk=document.createElement('span');xk.textContent=' ✗';xk.style.color='#C0392B';xk.style.fontWeight='900';el.appendChild(xk);
    }
  }
  const exp=document.getElementById(`rlexp-${key}`);
  if(exp){
    exp.innerHTML=(isCorrect?'<span style="color:#27AE60;font-weight:700">🎉 정답!</span> ':'<span style="color:#C0392B;font-weight:700">❌ 틀렸어요.</span> ')+(hint?'💡 '+hint:'');
    exp.style.display='block';
    exp.style.background=isCorrect?'#EBF9F1':'#FEECEC';
    exp.style.border=isCorrect?'1px solid #2ECC71':'1px solid #E74C3C';
    exp.style.padding='10px 14px';exp.style.fontSize='13px';exp.style.fontWeight='500';
  }
}

// ── SELF CHECK (optional tab) ──────────────────────────
function buildSelfCheck(){
  const sc=DATA.self_check;
  if(!sc||!sc.length)return'<div class="loading">데이터 준비 중이에요.</div>';
  const epKey=`${DATA.level}_${DATA.id}`;
  const saved=new Set(_scGet()[epKey]||[]);
  const allOn=sc.length>0&&saved.size>=sc.length;
  return`<div style="padding:4px 0" id="sc-wrap" data-epkey="${epKey}" data-total="${sc.length}">
    <div style="font-size:13px;font-weight:700;color:var(--warm-900);margin-bottom:4px">✅ 이번 에피소드에서 배운 것들이에요. 할 수 있나요?</div>
    <div style="font-size:11.5px;color:var(--warm-500);margin-bottom:14px;line-height:1.6">아직 못 하는 건 비워 두세요 — 그게 다음에 뭘 볼지 알려줘요. 전부 체크하면 목록의 ✅가 <b>⭐</b>로 바뀌어요.<br><span style="font-style:italic">Leave unchecked what you cannot do yet. All checked turns ✅ into ⭐.</span></div>
    ${sc.map((item,i)=>{const ko=typeof item==='string'?item:(item.ko||'');const en=typeof item==='string'?'':(item.en||'');const on=saved.has(i);return`
      <label data-i="${i}" style="display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid ${on?'var(--teal-md)':'var(--warm-300)'};border-radius:var(--radius-md);padding:12px 16px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color .2s" onclick="toggleSC(this)">
        <span style="font-size:20px;transition:transform .2s">${on?'✅':'⬜'}</span>
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--warm-900)">${esc(ko)}</div>
          ${en?`<div style="font-size:11px;color:var(--warm-500);margin-top:2px">${esc(en)}</div>`:''}
        </div>
      </label>`}).join('')}
    <div id="sc-star" style="margin-top:12px;text-align:center;font-size:12.5px;font-weight:700;color:${allOn?'var(--amber)':'var(--warm-400)'}">${allOn?'⭐ 자기점검까지 끝냈어요!':'전부 체크하면 이 편에 ⭐가 붙어요'}</div>
  </div>`;
}
function toggleSC(el){
  const box=el.querySelector('span');
  const checked=box.textContent==='✅';
  box.textContent=checked?'⬜':'✅';
  el.style.borderColor=checked?'var(--warm-300)':'var(--teal-md)';
  _scPersist();
}
// 체크 상태를 프로필에 저장하고, 전부 체크됐으면 ⭐를 붙임
function _scPersist(){
  const wrap=document.getElementById('sc-wrap'); if(!wrap) return;
  const epKey=wrap.dataset.epkey, total=parseInt(wrap.dataset.total,10)||0;
  const arr=[];
  wrap.querySelectorAll('label[data-i]').forEach(l=>{
    const b=l.querySelector('span');
    if(b&&b.textContent==='✅') arr.push(parseInt(l.dataset.i,10));
  });
  _scSet(epKey,arr);
  const allOn=total>0&&arr.length>=total;
  _markEpStar(epKey,allOn);
  const tag=document.getElementById('sc-star');
  if(tag){
    tag.textContent=allOn?'⭐ 자기점검까지 끝냈어요!':'전부 체크하면 이 편에 ⭐가 붙어요';
    tag.style.color=allOn?'var(--amber)':'var(--warm-400)';
  }
}




async function loadEpAndTab(epKey, tabName){
  closeIndex();
  // epKey may be 'L1_ep01' or 'L2_ep01' or plain 'ep01'
  const parts=epKey.split('_');
  const level=(parts.length>=2)?parts[0]:'L1';
  const epId=(parts.length>=2)?parts.slice(1).join('_'):epKey;
  await _doLoadEp(epId, level);
  showTab(tabName);
}

function getEpLabel(epKey){
  // epKey = 'L1_ep01' or 'L2_ep01'
  const ep=EPISODE_DATA[epKey]||EPISODE_DATA['L1_'+epKey]||EPISODE_DATA['L2_'+epKey];
  const parts=(epKey||'').split('_');
  const level=(parts.length>=2)?parts[0]:(ep?ep.level||'L1':'L1');
  const epId=(parts.length>=2)?parts.slice(1).join('_'):epKey;
  const num=(epId||'').replace('ep','');
  const lvlMap={'초급':'L1','중급':'L2','고급':'L3','기초':'Basics'};
  const lbl=lvlMap[level]||level;
  return lbl+' · ep'+num;
}

// ── 국어사전 정렬 (Unicode 코드포인트 기반, 한글 블록이 ㄱㄴㄷ 순으로 배열됨) ──
function _koCompare(a,b){
  for(let i=0;i<Math.min(a.length,b.length);i++){const d=a.charCodeAt(i)-b.charCodeAt(i);if(d!==0)return d;}
  return a.length-b.length;
}
// ── 초성(받침없는 자음) 추출 ──
function getOnset(ch){
  const c=(ch||'').charCodeAt(0);
  if(c<0xAC00||c>0xD7A3) return (ch||'#').toUpperCase();
  return ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'][Math.floor((c-0xAC00)/588)];
}
let _idxPage=0; const _IDX_PG=30; let _idxFiltered=[];
function _idxGoPage(pg, onset){
  _idxPage=pg;
  _renderIdxVocabPage();
  // scroll to onset section after render
  if(onset){
    const body=document.getElementById('idx-body');
    if(!body)return;
    const hdrs=body.querySelectorAll('.idx-section-hdr');
    for(const h of hdrs){if(h.textContent.trim()===onset){h.scrollIntoView({block:'start'});body.scrollTop=body.scrollTop-8;break;}}
  }
}
function _renderIdxVocabPage(){
  const words=_idxFiltered;
  const total=words.length;
  const totalPg=Math.max(1,Math.ceil(total/_IDX_PG));
  _idxPage=Math.max(0,Math.min(_idxPage,totalPg-1));
  const slice=words.slice(_idxPage*_IDX_PG,(_idxPage+1)*_IDX_PG);
  // 초성별 섹션 헤더 + 단어
  let html='';
  let cur=null;
  slice.forEach(v=>{
    const o=getOnset((v.korean||'')[0]||'');
    if(o!==cur){cur=o;html+=`<div class="idx-section-hdr">${esc(o)}</div>`;}
    html+=`<div class="idx-vocab-row">
      <div class="idx-vocab-kr">${esc(v.korean||'')} ${v.emoji||''}</div>
      <div style="font-size:11px;color:var(--warm-500);min-width:90px">${esc(v.romanization||'')}</div>
      <div class="idx-vocab-en">${esc(v.english||v.en||'')}</div>
      ${v._gloss?'<span style="font-size:9px;background:var(--mint,#DFF5EE);color:var(--teal);border-radius:7px;padding:1px 6px;margin-right:3px;white-space:nowrap">실생활</span>':''}
      <span class="idx-ep-badge" style="cursor:pointer" onclick="${v._essential?"closeIndex();loadBasics('essential')":`loadEpAndTab('${escA(v.ep||'')}','vocab')`}">${v._essential?'🗝️ 필수 낱말':esc(getEpLabel(v.ep||''))}</span>
      <button onclick="speakTTS('${escA(v.korean||'')}')" style="background:none;border:none;font-size:13px;cursor:pointer;opacity:.4">🔊</button>
    </div>`;
  });
  document.getElementById('idx-body').innerHTML=html||'<div style="color:var(--warm-500);font-size:13px;text-align:center;padding:30px">검색 결과 없음</div>';
  // 페이지 컨트롤 업데이트
  const pc=document.getElementById('idx-page-ctrl');
  if(pc){
    pc.style.display=totalPg>1?'flex':'none';
    pc.innerHTML=`<button class="idx-page-btn" onclick="_idxGoPage(${_idxPage-1})" ${_idxPage===0?'disabled':''}>◀</button>
      <span class="idx-page-info">${_idxPage+1} / ${totalPg}</span>
      <button class="idx-page-btn" onclick="_idxGoPage(${_idxPage+1})" ${_idxPage===totalPg-1?'disabled':''}>▶</button>`;
  }
}

function switchIdxTab(tab){
  idxTab=tab;
  document.querySelectorAll('.idx-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('idx-tab-'+tab).classList.add('active');
  document.getElementById('idx-search-input').value='';
  renderIdxBody();
}

function renderIdxBody(){
  const q=(document.getElementById('idx-search-input').value||'').toLowerCase();
  const body=document.getElementById('idx-body');
  if(!body)return;

  // 전체 에피소드 데이터 수집
  const allEps=Object.values(EPISODE_DATA).filter(ep=>ep&&ep.id);

  if(idxTab==='vocab'){
    // 전체 단어 수집
    let allWords=[];
    allEps.forEach(ep=>{
      const vocab=ep.vocab||[];
      const isGrouped=vocab.length>0&&vocab[0].items;
      if(isGrouped){
        vocab.forEach(g=>g.items.forEach(v=>allWords.push({...v,ep:(ep.level||'L1')+'_'+ep.id,epTitle:ep.title})));
      } else {
        vocab.forEach(v=>allWords.push({...v,ep:(ep.level||'L1')+'_'+ep.id,epTitle:ep.title}));
      }
    });
    // 색인 전용 어휘(실생활 광맥) — 새어휘 카드 없이 색인에만 노출
    Object.entries(GLOSSARY_POOL).forEach(([key,list])=>{
      (list||[]).forEach(v=>allWords.push({...v,ep:key,_gloss:true}));
    });
    // 필수낱말카드(Start Here) — 색인에도 등록, 배지 클릭 시 Basics로 이동
    ESSENTIAL_GROUPS.forEach(g=>{
      g.words.forEach(w=>allWords.push({korean:w.kr,english:w.en,romanization:w.rom,ep:'essential',_essential:true}));
    });
    // 검색 필터 + 정렬
    if(q) allWords=allWords.filter(v=>(v.korean||'').toLowerCase().includes(q)||(v.english||v.en||'').toLowerCase().includes(q));
    allWords.sort((a,b)=>_koCompare(a.korean||'',b.korean||''));
    _idxFiltered=allWords;
    _idxPage=0;
    // 초성 점프바 구성
    const onsetPage={};
    allWords.forEach((w,i)=>{
      const o=getOnset((w.korean||'')[0]||'');
      if(!(o in onsetPage)) onsetPage[o]=Math.floor(i/_IDX_PG);
    });
    const jbar=document.getElementById('idx-jump-bar');
    if(jbar) jbar.innerHTML=Object.entries(onsetPage).map(([o,pg])=>
      `<button class="idx-jump-btn" onclick="_idxGoPage(${pg},'${o}')">${o}</button>`).join('');
    _renderIdxVocabPage();

  } else if(idxTab==='grammar'){
    let allGram=[];
    allEps.forEach(ep=>{
      (ep.grammar||[]).forEach(g=>allGram.push({...g,ep:(ep.level||'L1')+'_'+ep.id,epTitle:ep.title}));
    });
    if(q) allGram=allGram.filter(g=>(g.title||'').toLowerCase().includes(q)||(g.explanation_en||'').toLowerCase().includes(q));
    let html='';
    if(!allGram.length){html='<div style="color:var(--warm-500);font-size:13px;text-align:center;padding:30px">검색 결과 없음</div>';}
    else{
      // 에피소드별 그룹
      const byEp={};
      allGram.forEach(g=>{
        if(!byEp[g.ep])byEp[g.ep]=[];
        byEp[g.ep].push(g);
      });
      Object.keys(byEp).sort().forEach(epKey=>{
        const ep=EPISODE_DATA[epKey]||allEps.find(e=>e.id===epKey);
        const epNum=(epKey||'').replace(/^(L1|L2|L3)_ep/,'');
        const lvlPart=(epKey||'').split('_')[0]||'L1';
        const lvlMap2={'초급':'L1','중급':'L2','고급':'L3'};
        const lvlLabel=lvlMap2[lvlPart]||lvlPart;
        html+=`<div class="idx-section-hdr">${esc(lvlLabel)} · EP.${esc(epNum)} ${esc(ep?ep.title:'')}</div>`;
        html+=byEp[epKey].map(g=>`
          <div class="idx-gram-row">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:16px">${esc(g.icon||'📌')}</span>
              <div>
                <div class="idx-gram-title">${esc(g.title||'')} <span class="idx-ep-badge" style="cursor:pointer" onclick="loadEpAndTab('${escA(g.ep||'')}','grammar')">${esc(getEpLabel(g.ep||''))}</span></div>
                ${g.rule?`<div class="idx-gram-rule">📐 ${esc(g.rule)}</div>`:''}
                <div style="font-size:11.5px;color:var(--warm-500);margin-top:2px">${esc(g.explanation_en||'')}</div>
              </div>
            </div>
          </div>`).join('');
      });
    }
    body.innerHTML=html;

  } else if(idxTab==='pron'){
    // 발음 — grammar 중 발음 관련 항목 + 불규칙 동사 패턴 자동 추출
    const pronKeywords=['불규칙','발음','pronunciation','irregular','받침','연음','liaison','sound'];
    let allPron=[];
    allEps.forEach(ep=>{
      (ep.grammar||[]).forEach(g=>{
        const txt=((g.title||'')+(g.explanation_en||'')).toLowerCase();
        if(pronKeywords.some(k=>txt.includes(k))){
          allPron.push({...g,ep:ep.id});
        }
      });
    });
    if(q) allPron=allPron.filter(g=>(g.title||'').toLowerCase().includes(q));
    let html='';
    if(!allPron.length){
      html=`<div style="text-align:center;padding:30px;color:var(--warm-500)">
        <div style="font-size:32px;margin-bottom:10px">🔤</div>
        <div style="font-size:13px">발음·불규칙 관련 문법 항목이 자동으로 표시돼요.<br>아직 해당 항목이 없거나 검색 결과가 없어요.</div>
      </div>`;
    } else {
      html=allPron.map(g=>`
        <div class="idx-pron-row">
          <div style="display:flex;align-items:flex-start;gap:10px">
            <span style="font-size:18px">${esc(g.icon||'🔤')}</span>
            <div>
              <div class="idx-pron-word">${esc(g.title||'')} <span class="idx-ep-badge" style="cursor:pointer" onclick="loadEpAndTab('${escA(g.ep||'')}','pron')">${esc(getEpLabel(g.ep||''))}</span></div>
              ${g.rule?`<div class="idx-pron-note">📐 ${esc(g.rule)}</div>`:''}
              ${(g.examples||[]).slice(0,2).map(ex=>`<div style="font-size:12px;color:var(--warm-700);margin-top:3px">${esc(ex.ko)} <span style="color:var(--warm-500)">— ${esc(ex.en)}</span></div>`).join('')}
            </div>
          </div>
        </div>`).join('');
    }
    body.innerHTML=html;
  }
}

function combineSyl(onset,nucleus,coda){
  const onsets=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

  const oi=onsets.indexOf(onset),ni=nuclei.indexOf(nucleus),ci=codas.indexOf(coda||'');

const _wuSeen=new Set(); // session memory: epKeys already shown warm-up

async function loadEp(epId, level='L1'){
  const epKey=level+'_'+epId;
  if(_wuSeen.has(epKey)){ await _doLoadEp(epId,level); return; }
  const epNum=parseInt(epId.replace(/\D/g,''));
  let pool;
  if(level==='L1'){
    pool=WARMUP_POOL.filter(q=>parseInt(q.ep.replace(/\D/g,''))<epNum);
  } else {
    // L2~L5: 이전 편 어휘로 빠른 복습 문제 자동 생성 (정적 은행 대신)
    pool=await _buildVocabWarmup(level, epNum);
  }
  if(pool.length>=3){
    _showWarmup(epId, level, pool);
  } else {
    await _doLoadEp(epId, level);
  }
}
// 이전 편 어휘 기반 '뜻 맞추기' 빠른 복습 문제 생성 (현재 레벨 앞선 편, 부족하면 이전 레벨 보강)
async function _buildVocabWarmup(level, epNum){
  const LVARR={L1:L1_EPISODES,L2:L2_EPISODES,L3:L3_EPISODES,L4:L4_EPISODES,L5:L5_EPISODES,L6:L6_EPISODES};
  const curN=parseInt(String(level).replace(/\D/g,''))||1;
  const targets=[];
  (LVARR[level]||[]).forEach(ep=>{ if(!ep.disabled && parseInt(ep.id.replace(/\D/g,''))<epNum) targets.push([level,ep]); });
  if(targets.length<2 && curN>1){
    const prev='L'+(curN-1);
    (LVARR[prev]||[]).forEach(ep=>{ if(!ep.disabled) targets.push([prev,ep]); });
  }
  const words=[];
  await Promise.all(targets.map(async ([lv,ep])=>{
    const epKey=lv+'_'+ep.id;
    let data=EPISODE_DATA[epKey];
    if(!data){ try{const r=await fetch('data/nhs/'+lv+'/'+ep.id+'.json'); if(r.ok){data=await r.json(); _resolveRefs(data); EPISODE_DATA[epKey]=data;}}catch(e){return;} }
    if(!data||!data.vocab)return;
    data.vocab.forEach(cat=>(cat.items||[]).forEach(it=>{ if(it.korean&&it.english) words.push({korean:it.korean,english:it.english}); }));
  }));
  const seen=new Set(), uniq=[];
  words.forEach(w=>{ if(!seen.has(w.korean)){seen.add(w.korean); uniq.push(w);} });
  const allEng=[...new Set(uniq.map(x=>x.english))];
  if(uniq.length<4 || allEng.length<4) return [];
  const qs=[];
  for(const w of shuffleArr(uniq)){
    if(qs.length>=8)break;
    const distract=shuffleArr(allEng.filter(e=>e!==w.english)).slice(0,3);
    if(distract.length<3)continue;
    const choices=shuffleArr([w.english,...distract]);
    qs.push({q:'"'+w.korean+'"의 뜻은? · What does it mean?', choices:choices, ans:choices.indexOf(w.english)});
  }
  return qs;
}

function _renderWarmupQ(){
  const dots=document.getElementById('wu-dots');
  if(dots)dots.innerHTML=[0,1,2].map(i=>'<div style="flex:1;height:6px;border-radius:3px;background:'+(i<_wuIdx?'var(--teal)':i===_wuIdx?'var(--amber)':'var(--gray-200)')+'"></div>').join('');

  if(!body)return;
  const q=_wuQs[_wuIdx];

  body.innerHTML=
    '<div style="font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">질문 '+(_wuIdx+1)+' / 3</div>'

    +'<div style="display:flex;flex-direction:column;gap:10px;">'
    +q.choices.map((c,i)=>'<button id="wu-opt-'+i+'" onclick="_wuPick('+i+')" style="text-align:left;padding:13px 17px;border:2px solid var(--gray-200);border-radius:11px;background:#fff;font-size:15px;cursor:pointer;transition:background 0.15s,border-color 0.15s;font-weight:500;color:var(--gray-900);">'+String.fromCharCode(65+i)+'. '+c+'</button>').join('')
    +'</div>';
}

function _wuPick(idx){
  if(_wuChosen!==null)return;
  _wuChosen=idx;
  const q=_wuQs[_wuIdx];
  const correct=q.ans;
  for(let i=0;i<q.choices.length;i++){
    const btn=document.getElementById('wu-opt-'+i);
    if(!btn)continue;
    btn.disabled=true;
    if(i===correct){btn.style.background='#dcfce7';btn.style.borderColor='#22c55e';btn.style.color='#15803d';}
    else if(i===idx&&idx!==correct){btn.style.background='#fee2e2';btn.style.borderColor='#ef4444';btn.style.color='#dc2626';}
  }
  if(idx===correct)_wuScore++;
  setTimeout(()=>{_wuIdx++;_wuIdx>=3?_renderWarmupScore():_renderWarmupQ();},1300);
}

function _renderWarmupScore(){
  const dots=document.getElementById('wu-dots');
  if(dots)dots.innerHTML=[0,1,2].map(()=>'<div style="flex:1;height:6px;border-radius:3px;background:var(--teal);"></div>').join('');

  if(!body)return;
  const em=_wuScore===3?'🏆':_wuScore===2?'🌟':'📚';
  const msg=_wuScore===3?'완벽해요! Perfect!':_wuScore===2?'잘했어요! Well done!':'복습이 도움 됐죠? Keep it up!';

    +'<div style="font-size:60px;margin-bottom:14px;">'+em+'</div>'
    +'<div style="font-size:32px;font-weight:800;color:var(--gray-900);margin-bottom:8px;">'+_wuScore+' / 3</div>'
    +'<div style="font-size:14px;color:var(--warm-600);margin-bottom:28px;">'+msg+'</div>'
    +'<button onclick="_wuGo()" style="background:var(--teal);color:#fff;border:none;border-radius:11px;padding:15px 38px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,128,128,0.3);">에피소드 시작 →</button>'

}

const PROG_KEYS = ['_ep_done','_ep_star','_sc','_prog',
                   '_srs','_fc_review','_fc_known'];
let _progTimer = null;

function _progUser(){
  try{
    const u = JSON.parse(localStorage.getItem('hq_user')
                      || sessionStorage.getItem('hq_user') || 'null');
    if(!u || !u.token) return null;
    if(['student','teacher','admin'].indexOf(u.role) < 0) return null;  // 체험·게스트 제외
    return u;
  }catch(e){ return null; }
}
function _progCollect(p){
  const out = {};
  PROG_KEYS.forEach(k=>{
    const v = localStorage.getItem('nms_'+p+k);
    if(v === null) return;
    try{ out[k] = JSON.parse(v); }catch(e){ out[k] = v; }
  });
  return out;
}

/* ── 🔑 진도의 주인 (2026-08-07) ──────────────────────────
   전에는 My Notes 프로필 이름이 진도의 주인이었습니다. 그래서
   프로필을 바꾸거나 이름을 고치면 진도가 따라다녔습니다.
   이제 로그인하면 진도는 '로그인 ID'에 붙습니다(@kate 꼴).
   표시명이 아니라 로그인 ID인 이유 — 표시명은 언제든 바꿀 수
   있는데 그때마다 진도가 끊기면 안 되기 때문입니다.
   My Notes 는 이제 순수하게 메모·색·아바타·작문만 맡습니다.
   로그인하지 않은 학습자는 예전 그대로 프로필 이름을 씁니다.   */
function _progOwner(){
  try{
    const u = JSON.parse(localStorage.getItem('hq_user')
                      || sessionStorage.getItem('hq_user') || 'null');
    // guest(공용 체험 계정)는 여럿이 함께 쓰므로 계정에 묶지 않습니다
    if(u && u.name && ['student','teacher','admin','trial'].indexOf(u.role) >= 0)
      return '@' + u.name;
  }catch(e){}
  return localStorage.getItem('nms_current') || '';
}
function _progOwnerLabel(){          // 화면에 보여 줄 이름
  try{
    const u = JSON.parse(localStorage.getItem('hq_user')
                      || sessionStorage.getItem('hq_user') || 'null');
    if(u && u.name && ['student','teacher','admin','trial'].indexOf(u.role) >= 0)
      return u.display_name || u.name;
  }catch(e){}
  return localStorage.getItem('nms_current') || '';
}
/* 예전에 프로필 이름으로 쌓인 진도를 계정으로 한 번만 옮깁니다.
   ⚠️ '지금 켜 놓은 프로필이 내 표시명과 같을 때'만 옮깁니다 —
      한 화면을 여럿이 쓰는 집에서 남의 진도를 가져오지 않도록. */
function _progAdoptAccount(){
  try{
    const own = _progOwner();
    if(own.charAt(0) !== '@') return;
    const u = JSON.parse(localStorage.getItem('hq_user')
                      || sessionStorage.getItem('hq_user') || 'null');
    if(!u) return;
    const cur = localStorage.getItem('nms_current') || '';
    if(!cur || cur !== (u.display_name || u.name)) return;
    if(PROG_KEYS.some(k => localStorage.getItem('nms_' + own + k) !== null)) return;
    PROG_KEYS.forEach(function(k){
      const v = localStorage.getItem('nms_' + cur + k);
      if(v !== null){
        localStorage.setItem('nms_' + own + k, v);
        localStorage.removeItem('nms_' + cur + k);
      }
    });
  }catch(e){}
}
_progAdoptAccount();

function _progPush(){          // 연달아 눌러도 3초 뒤 한 번만
  if(_progTimer) clearTimeout(_progTimer);
  _progTimer = setTimeout(_progPushNow, 3000);
}
function _progPushNow(){
  _progTimer = null;
  try{
    const u = _progUser();   if(!u) return;
    const own = _progOwner();
    if(own !== '@' + u.name) return;   // 진도의 주인이 이 계정일 때만
    if(!window.HQ_SUPABASE) return;
    const sb = window.HQ_SUPABASE.client();
    if(!sb) return;
    const payload = _progCollect(own);
    // 🔒 빈 진도로 서버를 덮어쓰지 않습니다.
    //    새 기기·새 주소·브라우저 데이터 삭제 직후에는 로컬이 비어 있는데,
    //    그대로 보내면 서버에 쌓인 기록이 그 순간 지워집니다.
    if(Object.keys(payload).length === 0) return;
    sb.rpc('progress_push', { p_token: u.token,
                              p_profile: (u.display_name || u.name),
                              p_data: payload })
      .catch(function(){ /* 조용히 무시 */ });
  }catch(e){ /* 조용히 무시 — 로컬은 그대로입니다 */ }
}
// 로그인한 채로 앱을 열면, 그전까지 쌓인 진도를 한 번 올립니다
setTimeout(_progPushNow, 4000);

function _fcCardId(c){ return (c.level||'L1')+'_'+c.epId+'_'+c.korean; }
function _fcReviewSet(){
  const p=_progOwner(); if(!p) return new Set();
  return new Set(JSON.parse(localStorage.getItem('nms_'+p+'_fc_review')||'[]'));
}
function _fcKnownSet(){
  const p=_progOwner(); if(!p) return new Set();
  return new Set(JSON.parse(localStorage.getItem('nms_'+p+'_fc_known')||'[]'));
}
function _fcMark(card, isReview){
  const p=_progOwner(); if(!p) return;
  const rev=_fcReviewSet(), kn=_fcKnownSet(), id=_fcCardId(card);
  _srsUpdate(id, !isReview);
  if(isReview){ rev.add(id); kn.delete(id); }
  else{ kn.add(id); rev.delete(id); }
  localStorage.setItem('nms_'+p+'_fc_review', JSON.stringify([...rev]));
  localStorage.setItem('nms_'+p+'_fc_known',  JSON.stringify([...kn]));
  _progPush();
}
function _epDoneSet(){
  const p=_progOwner(); if(!p) return new Set();
  return new Set(JSON.parse(localStorage.getItem('nms_'+p+'_ep_done')||'[]'));
}
function _markEpDone(epKey){
  const p=_progOwner(); if(!p) return;
  const done=_epDoneSet(); done.add(epKey);
  localStorage.setItem('nms_'+p+'_ep_done', JSON.stringify([...done]));
  _progPush();
  // Refresh sidebar checkmarks
  _refreshSidebarDone();
}

// ══════════════════════════════════════════════════════
// ── 간격 반복(SRS) — 어휘 재순환 엔진
//   상자 1~5, 간격 1·3·7·16·35일. 맞히면 한 칸 위, 틀리면 1번으로.
//   저장: nms_{프로필}_srs = { "L5_ep03_명의": {b:3, due:"2026-08-15"} }
// ══════════════════════════════════════════════════════
const SRS_GAP={1:1,2:3,3:7,4:16,5:35};
function _srsToday(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function _srsPlus(days){ const d=new Date(); d.setDate(d.getDate()+days); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function _srsKey(){ const p=_progOwner(); return p?('nms_'+p+'_srs'):''; }
function _srsMap(){
  const k=_srsKey(); if(!k) return {};
  try{
    const raw=localStorage.getItem(k);
    if(raw) return JSON.parse(raw);
    // 기존 기록 이사: 알아요 → 상자3, 다시볼래요 → 상자1
    const m={}, t=_srsToday();
    _fcKnownSet().forEach(id=>{ m[id]={b:3,due:t}; });
    _fcReviewSet().forEach(id=>{ m[id]={b:1,due:t}; });
    localStorage.setItem(k,JSON.stringify(m));
    return m;
  }catch(e){ return {}; }
}
function _srsSave(m){ const k=_srsKey(); if(!k)return; try{ localStorage.setItem(k,JSON.stringify(m)); _progPush(); }catch(e){} }
function _srsUpdate(cardId,ok){
  const m=_srsMap(), cur=m[cardId]||{b:1,due:_srsToday()};
  // 처음 보는 단어를 맞히면 상자 2(3일 뒤). 틀리면 언제나 상자 1(내일).
  const b=ok?Math.min((cur.b||1)+1,5):1;
  m[cardId]={b:b,due:_srsPlus(SRS_GAP[b])};
  _srsSave(m);
}
function _srsDueCount(){
  const m=_srsMap(), t=_srsToday();
  return Object.keys(m).filter(id=>(m[id].due||'')<=t).length;
}
function _srsUpdateBadge(){
  const el=document.getElementById('fc-due-badge'); if(!el)return;
  const n=_srsDueCount();
  el.textContent=n?' ('+n+')':'';
  el.style.color=n?'var(--coral)':'';
}

let _fcAllCards=[],_fcCards=[],_fcEps=[],_fcLevels=[],_fcCurNum=1,_fcIdx=0,_fcFlipped=false;
let _fcFilter=new Set(); // empty = all episodes

async function openFlashcards(){
  document.getElementById('fc-overlay').classList.add('open');
  document.getElementById('fc-modal').innerHTML='<div style="text-align:center;padding:60px 20px;"><div style="font-size:40px;margin-bottom:14px;">⏳</div><div style="font-size:15px;color:var(--warm-600);">단어 불러오는 중...<br><small>Loading vocabulary...</small></div></div>';
  await _sharedSetsReady;
  const _clv=(typeof curLevel!=='undefined'?curLevel:'');

  let curNum=parseInt(String(_lvRaw).replace(/[^0-9]/g,''))||1;
  if(curNum<1)curNum=1; if(curNum>6)curNum=6;
  _fcCurNum=curNum;
  const _LVARR={1:L1_EPISODES,2:L2_EPISODES,3:L3_EPISODES,4:L4_EPISODES,5:L5_EPISODES,6:L6_EPISODES};
  _fcLevels=[]; const cards=[]; const _tasks=[];

      if(!data){

      }
      if(!data||!data.vocab)return;
      data.vocab.forEach(cat=>{
        (cat.items||[]).forEach(item=>{
          if(!item.korean||!item.english)return;
          cards.push({korean:item.korean,rom:item.romanization||'',english:item.english,level:lv,emoji:item.emoji||'📖',note:item.note||'',epId:ep.id,ep:ep.label,cat:(cat.category||'').replace(/^[\u{1F300}-\u{1FAD6}\s]+/u,'').trim()});
        });
      });
    })()); });
  }
  await Promise.all(_tasks);
  _fcAllCards=cards; _fcFilter=new Set();
  _fcApplyFilter();
}

// 레벨 거리 기반 가중 샘플링 — 현재 레벨에 가까울수록 많이, 하위 레벨은 적게(누적 유지)
function _fcWeightedPick(cards, need, curNum){
  const byLv={};
  cards.forEach(c=>{const n=parseInt(String(c.level||'L1').replace(/[^0-9]/g,''))||1;(byLv[n]=byLv[n]||[]).push(c);});
  const lvls=Object.keys(byLv).map(Number);
  lvls.forEach(n=>{byLv[n]=shuffleArr(byLv[n]);});
  const out=[];
  while(out.length<need){
    const avail=lvls.filter(n=>byLv[n].length>0);
    if(!avail.length)break;
    let total=0; const w={};
    avail.forEach(n=>{const wt=Math.pow(2,n-curNum); w[n]=wt; total+=wt;}); // 2^(레벨-현재): 현재=1, 한 단계 아래마다 1/2
    let r=Math.random()*total, pick=avail[avail.length-1];
    for(const n of avail){ r-=w[n]; if(r<=0){pick=n;break;} }
    out.push(byLv[pick].pop());
  }
  return out;
}
function _fcApplyFilter(){
  const CAP=25;
  const pool=_fcFilter.size===0?_fcAllCards:_fcAllCards.filter(c=>_fcFilter.has(c.level));
  const m=_srsMap(), today=_srsToday();
  // ① 오늘 복습할 카드 (낮은 상자부터 = 자주 틀린 것 먼저)
  const due=pool.filter(c=>{const st=m[_fcCardId(c)];return st&&(st.due||'')<=today;});
  const deck=shuffleArr(due).sort((a,b)=>(m[_fcCardId(a)].b||1)-(m[_fcCardId(b)].b||1)).slice(0,CAP);
  // ② 남는 자리는 아직 한 번도 안 본 카드로 (레벨 가중)
  if(deck.length<CAP){
    const fresh=pool.filter(c=>!m[_fcCardId(c)]);
    deck.push(..._fcWeightedPick(fresh, CAP-deck.length, _fcCurNum));
  }
  // ③ 그래도 모자라면 아직 복습일이 안 된 카드로 채움
  if(deck.length<CAP){
    const inDeck=new Set(deck.map(_fcCardId));
    const later=pool.filter(c=>!inDeck.has(_fcCardId(c)));
    deck.push(...shuffleArr(later).slice(0,CAP-deck.length));
  }
  _fcCards=deck;
  _fcIdx=0; _fcFlipped=false; _renderFC();
  _srsUpdateBadge();
}

function _fcChip(lvKey){
  if(lvKey===null){_fcFilter.clear();}
  else{if(_fcFilter.has(lvKey))_fcFilter.delete(lvKey);else _fcFilter.add(lvKey);}
  _fcApplyFilter();
}

function _fcClose(){document.getElementById('fc-overlay').classList.remove('open');}
function _fcShuffle(){_fcApplyFilter();}
function _fcFlip(){
  _fcFlipped=!_fcFlipped;
  const c=document.getElementById('fc-card-inner');
  if(c) c.classList.toggle('flipped',_fcFlipped);
  const tw=document.getElementById('fc-type-wrap');

    if(disp) disp.innerHTML='';
  } else {
    // focus input when flipped to back
    setTimeout(()=>{const inp=document.getElementById('fc-type-input');if(inp)inp.focus();},50);
  }
}
function _fcPrev(){if(_fcIdx>0){_fcIdx--;_fcFlipped=false;_renderFC();}}
function _fcNext(){if(_fcIdx<_fcCards.length-1){_fcIdx++;_fcFlipped=false;_renderFC();}}
function _fcUpdateTyping(input, target){
  const disp=document.getElementById('fc-type-disp');
  if(!disp)return;
  const typed=input.value;
  if(typed===target){
    disp.innerHTML='<span style="color:#16a34a;font-size:18px;font-weight:800;">🎉 정답!</span>';
    input.style.borderColor='#22c55e'; input.style.background='#f0fdf4'; return;
  }
  let h='';
  for(let i=0;i<target.length;i++){
    const ch=esc(target[i]);
    if(i<typed.length){
      h+='<span style="color:'+(typed[i]===target[i]?'#16a34a':'#dc2626')+';font-weight:800;">'+ch+'</span>';
    }else{
      h+='<span style="color:#cbd5e1;">'+ch+'</span>';
    }
  }
  disp.innerHTML=h;
  input.style.borderColor=typed.length?'var(--amber)':'var(--gray-200)';
  input.style.background='';
}

function _fcMarkAndNext(isReview){
  _fcMark(_fcCards[_fcIdx], isReview);
  if(_fcIdx<_fcCards.length-1){_fcIdx++;_fcFlipped=false;_renderFC();}
  else{
    // End of deck — reshuffle with SRS priority
    _fcApplyFilter();
  }
}

  const allOn=_fcFilter.size===0;
  const chipsHtml='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">'

    +_fcLevels.map(lv=>{const on=_fcFilter.has(lv);return '<button class="fc-chip'+(on?' on':'')
      +'" onclick="_fcChip(\''+lv+'\')">'+lv.replace('L','Lv')+'</button>';}).join('')
    +'</div>';
  const srsHelpHtml='<details style="margin:0 0 12px;font-size:11.5px;">'
    +'<summary style="cursor:pointer;font-weight:700;color:var(--teal-dark);">💡 상자 번호(1/5~5/5)가 뭔가요?</summary>'

  {dict:'알다',rom:'alda',mean:'to know',haeyo:'알아요',haeyoRom:'arayo',neg:'몰라요',negRom:'mollayo'},
];
let verbGameIdx=0,verbGameAnswered=false;
function shuffleArr(a){return a.slice().sort(()=>Math.random()-.5);}
function renderVerbGame(){
  const q=VERB_DATA[verbGameIdx];
  const box=document.getElementById('verb-game-box');
  if(!box)return;
  const wrongs=shuffleArr(VERB_DATA.filter((_,i)=>i!==verbGameIdx)).slice(0,3).map(v=>v.haeyo);
  const choices=shuffleArr([q.haeyo,...wrongs]);
  verbGameAnswered=false;
  box.innerHTML='<div class="verb-game-title">🎮 사전형 → 해요체 Quiz</div>'
    +'<div class="verb-game-q">'+q.dict+'<div class="verb-game-hint">'+q.rom+' · "'+q.mean+'"</div></div>'
    +'<div class="verb-game-choices">'+choices.map(c=>'<button class="verb-choice" onclick="answerVerb(\''+c+'\')">'+c+'</button>').join('')+'</div>'
    +'<div class="verb-game-result" id="vg-result"></div>'
    +'<button class="verb-game-next" id="vg-next" onclick="nextVerbGame()">다음 →</button>';
}
function answerVerb(chosen){
  if(verbGameAnswered)return;
  verbGameAnswered=true;
  const q=VERB_DATA[verbGameIdx];
  document.querySelectorAll('.verb-choice').forEach(b=>{
    if(b.textContent===q.haeyo)b.classList.add('correct');
    else if(b.textContent===chosen&&chosen!==q.haeyo)b.classList.add('wrong');
  });
  const res=document.getElementById('vg-result'),nxt=document.getElementById('vg-next');
  if(chosen===q.haeyo){res.innerHTML='✅ 정답! <strong>'+q.haeyo+'</strong> ('+q.haeyoRom+')';res.style.color='var(--green-600)';}
  else{res.innerHTML='❌ 아쉬워요. 정답은 <strong>'+q.haeyo+'</strong> ('+q.haeyoRom+')';res.style.color='var(--rose-500)';}
  if(nxt)nxt.style.display='block';
}
function nextVerbGame(){verbGameIdx=(verbGameIdx+1)%VERB_DATA.length;renderVerbGame();}
