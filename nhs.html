let wCanvas=null,wCtx=null,wDrawing=false,wLX=0,wLY=0;
const WRITE_CHARS=[
  {kr:'가',rom:'ga'},{kr:'나',rom:'na'},{kr:'다',rom:'da'},{kr:'라',rom:'ra'},
  {kr:'마',rom:'ma'},{kr:'바',rom:'ba'},{kr:'사',rom:'sa'},{kr:'아',rom:'a'},
  {kr:'자',rom:'ja'},{kr:'차',rom:'cha'},{kr:'카',rom:'ka'},{kr:'타',rom:'ta'},
  {kr:'파',rom:'pa'},{kr:'하',rom:'ha'},{kr:'한',rom:'han'},{kr:'국',rom:'guk'},
  {kr:'어',rom:'eo'},{kr:'학',rom:'hak'},{kr:'교',rom:'gyo'},{kr:'선',rom:'seon'},
  {kr:'생',rom:'saeng'},{kr:'님',rom:'nim'},
];
let curWriteChar=WRITE_CHARS[0];
function selectWriteChar(kr){
  curWriteChar=WRITE_CHARS.find(c=>c.kr===kr)||WRITE_CHARS[0];
  document.querySelectorAll('.wchar-btn').forEach(b=>b.classList.toggle('active',b.textContent===kr));
  const gc=document.getElementById('wguide-char'),gr=document.getElementById('wguide-rom');
  if(gc)gc.textContent=curWriteChar.kr;if(gr)gr.textContent=curWriteChar.rom;
  clearCanvas();
}
function initWritingCanvas(){
  wCanvas=document.getElementById('writing-canvas');
  if(!wCanvas)return;
  wCtx=wCanvas.getContext('2d');
  wCtx.strokeStyle='#1a1a1a';wCtx.lineWidth=4;wCtx.lineCap='round';wCtx.lineJoin='round';
  drawGridLines();
  wCanvas.addEventListener('mousedown',e=>{const r=wCanvas.getBoundingClientRect();wDrawing=true;wLX=e.clientX-r.left;wLY=e.clientY-r.top;});
  wCanvas.addEventListener('mousemove',e=>{if(!wDrawing)return;const r=wCanvas.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;wCtx.beginPath();wCtx.moveTo(wLX,wLY);wCtx.lineTo(x,y);wCtx.stroke();wLX=x;wLY=y;});
  wCanvas.addEventListener('mouseup',()=>wDrawing=false);
  wCanvas.addEventListener('mouseleave',()=>wDrawing=false);
  wCanvas.addEventListener('touchstart',e=>{e.preventDefault();const r=wCanvas.getBoundingClientRect();const t=e.touches[0];wDrawing=true;wLX=t.clientX-r.left;wLY=t.clientY-r.top;},{passive:false});
  wCanvas.addEventListener('touchmove',e=>{e.preventDefault();if(!wDrawing)return;const r=wCanvas.getBoundingClientRect();const t=e.touches[0];const x=t.clientX-r.left,y=t.clientY-r.top;wCtx.beginPath();wCtx.moveTo(wLX,wLY);wCtx.lineTo(x,y);wCtx.stroke();wLX=x;wLY=y;},{passive:false});
  wCanvas.addEventListener('touchend',()=>wDrawing=false);
}
function drawGridLines(){
  if(!wCtx||!wCanvas)return;
  const w=wCanvas.width,h=wCanvas.height;
  wCtx.clearRect(0,0,w,h);
  wCtx.save();wCtx.strokeStyle='#e8e8e8';wCtx.lineWidth=1;
  wCtx.beginPath();wCtx.moveTo(w/2,0);wCtx.lineTo(w/2,h);wCtx.stroke();
  wCtx.beginPath();wCtx.moveTo(0,h/2);wCtx.lineTo(w,h/2);wCtx.stroke();
  wCtx.beginPath();wCtx.moveTo(0,0);wCtx.lineTo(w,h);wCtx.stroke();
  wCtx.beginPath();wCtx.moveTo(w,0);wCtx.lineTo(0,h);wCtx.stroke();
  wCtx.strokeStyle='#cccccc';wCtx.lineWidth=1.5;wCtx.strokeRect(2,2,w-4,h-4);
  wCtx.restore();wCtx.strokeStyle='#1a1a1a';wCtx.lineWidth=4;
}
function clearCanvas(){if(!wCtx||!wCanvas)return;drawGridLines();}

async function setLevel(btn){
  await _epIdxReady;
  const _lv=btn.classList.contains('level-btn-basis')?'Basics':btn.textContent.trim();
  const _n = _lvNum(_lv);
  if(_n > NHS_OPEN_MAX){
    alert('Level 3부터는 회원만 이용할 수 있어요.\n\n지금은 Level 1·2를 누구나 볼 수 있고, Level 3 이상은 실제 학생들과 함께 검증하는 중이라 잠겨 있어요.\n\nLevels 3+ are for members. Levels 1-2 are open to everyone — Level 3 and up are still being tested with real students.');
    return;
  }
  document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  curLevel=_lv;
  const hdr=document.querySelector('.sidebar-hdr,.sidebar-hdr-amber');
  if(curLevel==='Basics'){
    if(hdr){hdr.className='sidebar-hdr-amber';hdr.innerHTML='🌱 시작하기 · Start';}
    buildBasicsSidebar();
    loadBasics(curBasicsTopic);
  }else{
    if(hdr){hdr.className='sidebar-hdr';hdr.innerHTML='📺 Episodes';}
    const lv=curLevel==='Level 6'?'L6':curLevel==='Level 5'?'L5':curLevel==='Level 4'?'L4':curLevel==='Level 3'?'L3':curLevel==='Level 2'?'L2':'L1';
    if(hdr){hdr.className='sidebar-hdr';hdr.innerHTML='📺 '+curLevel;}
    _enAutoForLevel(lv);
    buildSidebar(lv);
    loadEp('ep01',lv);
  }
}

// 🧭 학습 로드맵 — 혼자서 하는 전 과정 안내 + 기능 가이드

function _rmEpCounts(){
  const done=_epDoneSet(), star=_epStarSet(), out={};
  const arrs={L1:L1_EPISODES,L2:L2_EPISODES,L3:L3_EPISODES,L4:L4_EPISODES,L5:L5_EPISODES,L6:L6_EPISODES};
  Object.keys(arrs).forEach(lv=>{
    const eps=(arrs[lv]||[]).filter(e=>e&&e.id&&/^ep\d+$/.test(e.id));
    out[lv]={t:eps.length,d:eps.filter(e=>done.has(lv+'_'+e.id)).length,
             s:eps.filter(e=>star.has(lv+'_'+e.id)).length};
  });
  return out;
}

function _rmStep(num,icon,titleKo,titleEn,body,ok){
  return '<div style="display:flex;gap:13px;margin-bottom:15px;align-items:flex-start;">'
    +'<div style="flex:none;width:34px;height:34px;border-radius:50%;background:'+(ok?'var(--teal)':'var(--gray-100)')
      +';color:'+(ok?'#fff':'var(--warm-500)')+';font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;">'
      +(ok?'✓':num)+'</div>'
    +'<div style="flex:1;min-width:0;background:#fff;border:1.5px solid '+(ok?'var(--teal)':'var(--gray-200)')
      +';border-radius:12px;padding:13px 15px;">'
    +'<div style="font-size:15px;font-weight:800;color:var(--warm-900);">'+icon+' '+titleKo+'</div>'
    +'<div style="font-size:11.5px;color:var(--warm-500);margin-top:1px;font-style:italic;">'+titleEn+'</div>'
    +'<div style="margin-top:9px;font-size:13px;color:var(--warm-700);line-height:1.75;">'+body+'</div>'
    +'</div></div>';
}
function _rmBtn(label,fn,primary){
  return '<button class="lt-retry-btn" style="margin:8px 6px 0 0;font-size:12.5px;padding:6px 14px;'
    +(primary?'background:var(--teal);color:#fff;border-color:var(--teal);':'')+'" onclick="'+fn+'">'+label+'</button>';
}
// 영어 보조 문장
function _rmEn(t){ return '<div class="en-gloss" style="font-size:11px;color:var(--warm-400);font-style:italic;margin-top:3px;">'+t+'</div>'; }

async function loadRoadmap(){
  document.querySelectorAll('.basics-topic-item').forEach(el=>el.classList.remove('active'));
  const ca=document.getElementById('content-area');
  ca.innerHTML='<div style="padding:40px;text-align:center;color:var(--warm-500);">🧭 불러오는 중… Loading</div>';
  await _epIdxReady;
  const prof=_progOwnerLabel(), prog=_progGet(), cnt=_rmEpCounts();
  const srs=_srsMap(), srsN=Object.keys(srs).length, dueN=_srsDueCount();
  const totD=Object.values(cnt).reduce((a,b)=>a+b.d,0);

  // ── 로그인(My Notes) 안내 ──
  const loginBox=prof
    ? '<div style="background:var(--teal-50);border:1.5px solid var(--teal);border-radius:12px;padding:12px 15px;margin-bottom:14px;font-size:13px;color:var(--teal-dark);line-height:1.7;">'
      +'📓 <b>'+esc(prof)+'</b> 님으로 기록되고 있어요. 공부한 편·외운 단어·시험 점수가 저장됩니다.'
      +'<div style="font-size:11px;color:var(--warm-400);font-style:italic;margin-top:3px;">Your progress is being saved under this name.</div></div>'
    : '<div style="background:var(--amber-lt);border:1.5px solid var(--amber);border-radius:12px;padding:12px 15px;margin-bottom:14px;font-size:13px;color:var(--warm-900);line-height:1.7;">'
      +'📓 <b>먼저 이름을 만들어 주세요.</b> 상단 <b>📓 My Notes</b>에서 이름을 만들면 그때부터 <b>공부한 편·외운 단어·시험 점수</b>가 저장돼요. 이름이 없으면 아무것도 기록되지 않습니다.'
      +'<div style="font-size:11px;color:var(--warm-400);font-style:italic;margin-top:3px;">Open 📓 My Notes and create a name first — otherwise nothing is saved.</div>'
      +_rmBtn('📓 My Notes 열기 · Open','openNMS()',true)+'</div>';

  // ── Step 0. 한글 입문자 ──
  const s0='혹시 <b>한글을 아직 못 읽으시나요?</b> 그럼 여기가 진짜 출발점이에요. 에피소드는 그다음입니다.'
    +_rmEn('Cannot read Hangeul yet? Start here, not with the episodes.')
    +'<div style="margin-top:9px;background:var(--warm-50);border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.9;">'
    +'① <b>🔤 한글을 배워요</b> — 자음·모음·받침을 소리로 익혀요'
      +'<span class="en-gloss"><br><i>Learn the consonants, vowels and final consonants by sound.</i></span><br>'
    +'② 같은 화면 <b>✍️ 연습</b> 탭 — 자모 읽기 → 첫소리 찾기 → 음절 읽기 → 받침 → 단어 읽기'
      +'<span class="en-gloss"><br><i>Same screen, ✍️ Practice tab: read letters → find the first sound → read syllables → final consonants → read words.</i></span><br>'
    +'③ <b>📓 My Notes › ✏️ 한글 쓰기</b> — 손가락으로 직접 써 보기'
      +'<span class="en-gloss"><br><i>Trace the letters with your finger.</i></span></div>'
    +'<div style="margin-top:8px;font-size:12px;color:var(--warm-500)">💡 하루 20분이면 대개 <b>3~5일</b>에 읽을 수 있어요. 다 외우지 말고 <b>읽을 수만 있으면</b> 다음으로 넘어가세요.'

    +_rmBtn('🔤 한글 배우러 가기 · Learn Hangeul',"loadBasics('hangul')",true);

  // ── Step 1. 배치 테스트 ──
  const pl=prog.placement;
  const s1=(pl

    +'<div style="margin-top:8px;font-size:12px;color:var(--warm-500)">💡 한글을 갓 뗐다면 건너뛰고 <b>Level 1 ep01</b>부터 시작하세요.</div>'
    +_rmBtn(pl?'↺ 다시 풀기 · Retake':'🎯 배치 테스트 하기 · Take it','loadPlacementTest()',!pl);

  // ── Step 2. 에피소드 (자습 순서) ──
  const bars=Object.keys(cnt).filter(lv=>cnt[lv].t>0).map(lv=>{

    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px;">'
      +'<span style="flex:none;width:22px;font-weight:800;color:var(--warm-700)">'+lv+'</span>'
      +'<span style="flex:1;height:7px;background:var(--gray-100);border-radius:4px;overflow:hidden;">'
        +'<span style="display:block;height:100%;width:'+pct+'%;background:'+(pct===100?'var(--teal)':'var(--amber)')+';"></span></span>'

  const s2='한 편이 하루치예요. <b>혼자서도 이 순서대로만 하면 됩니다.</b>'

      +'<span class="en-gloss"><br><i>These two tabs appear only in some episodes.</i></span><br>'
    +'<b>5.</b> 💬 <b>Usage</b> — 같은 말이 상황에 따라 어떻게 달라지는지 모아 둔 곳이에요. <b>여기를 건너뛰는 분이 많아요</b>'
      +'<span class="en-gloss"><br><i>How the same expression shifts with the situation. Most learners skip this tab.</i></span><br>'

      +'<span class="en-gloss"><br><i>Grading the quiz marks ✅. Finishing the self-check turns it into ⭐.</i></span></div>'
    +'<div style="margin-top:8px;font-size:12px;color:var(--warm-500)">💡 하루에 두 편씩 나가지 마세요. <b>한 편을 이틀에 걸쳐</b>(첫날 1~4, 다음 날 5~7) 하는 게 더 오래 남아요.</div>'

  // ── Step 3. 매일 복습 ──
  const s3='새 편을 안 나가는 날에도 <b>이것만은</b> 하세요. 단어는 만난 횟수로 외워집니다.'

    +'<div style="margin-top:9px;display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;">'
    +'<span>만난 단어 <b style="color:var(--teal-dark)">'+srsN+'</b>개 <span style="color:var(--warm-400)">Words met</span></span>'
    +'<span>오늘 복습할 것 <b style="color:'+(dueN?'var(--amber-600)':'var(--warm-400)')+'">'+dueN+'</b>개 <span style="color:var(--warm-400)">Due today</span></span></div>'
    +'<div style="margin-top:9px;background:var(--warm-50);border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.9;">'
    +'💻 여기서는 왼쪽 아래 <b>🃏 복습 플래시카드</b> — 옆의 숫자가 오늘 몫이에요<br>'
    +'📱 폰에서는 <b>doranchae.com/hq-mobile.html</b> → <b>🗂️ 단어장</b><br>'
    +'<span style="color:var(--warm-500)">둘은 같은 기록을 씁니다(같은 브라우저 기준). 상자가 올라갈수록 다시 나오는 간격이 길어져요.</span></div>'
    +_rmBtn('🃏 지금 복습하기 · Review now','openFlashcards()',dueN>0);

  // ── Step 4. 마감 테스트 ──

  const s4='12편을 마치면 사이드바 맨 아래 <b>🏆 마감 테스트</b>가 있어요. <b>틀린 문제는 그 편으로 바로 가는 링크</b>가 나옵니다.'

function loadBasics(topicId){
  curBasicsTopic=topicId;
  document.querySelectorAll('.basics-topic-item').forEach(el=>el.classList.remove('active'));
  const item=document.getElementById('bt-'+topicId);
  if(item)item.classList.add('active');
  const topic=BASICS_TOPICS.find(t=>t.id===topicId);
  if(!topic)return;
  document.getElementById('content-area').innerHTML=
    '<div style="width:100%;max-width:860px;margin:0 auto;padding:24px;box-sizing:border-box;">'
    +'<div class="basics-header"><div class="basics-icon-big">'+topic.icon+'</div>'
    +'<div><div class="basics-title-kr">'+topic.label+'</div><div class="basics-title-en">'+topic.en+'</div></div></div>'
    +'<div id="basics-body"></div></div>';
  const body=document.getElementById('basics-body');
  if(topicId==='hangul')    body.innerHTML=buildHangul();
  if(topicId==='structure') body.innerHTML=buildStructure();
  if(topicId==='greetings') body.innerHTML=buildGreetings();
  if(topicId==='numbers')   body.innerHTML=buildNumbers();
  if(topicId==='writing')   body.innerHTML=buildWriting();
  if(topicId==='verbs')     body.innerHTML=buildVerbs();
  if(topicId==='essential') body.innerHTML=buildEssential();
  if(topicId==='questions') body.innerHTML=buildQuestions();
  if(topicId==='honorifics')body.innerHTML=buildHonorifics();
  if(topicId==='spacing')  body.innerHTML=buildSpacing();
  if(topicId==='hangul')  requestAnimationFrame(()=>updateSylResult());
  if(topicId==='writing') requestAnimationFrame(()=>initWritingCanvas());
  if(topicId==='verbs')   requestAnimationFrame(()=>renderVerbGame());
  if(topicId==='spacing') requestAnimationFrame(()=>renderSpGame());
}

function switchBtab(pfx,tabId){
  document.querySelectorAll('[id^="'+pfx+'-"]').forEach(p=>{if(p.classList.contains('btab-panel'))p.classList.remove('active');});
  document.querySelectorAll('[data-btab-group="'+pfx+'"]').forEach(b=>b.classList.remove('active'));
  const p=document.getElementById(pfx+'-'+tabId);if(p)p.classList.add('active');
  document.querySelectorAll('[data-btab-group="'+pfx+'"][data-tab="'+tabId+'"]').forEach(b=>b.classList.add('active'));
}

function hcHtml(item){
  return '<div class="hcard" onclick="speak(\''+item.kr+'\''+(item.audio?',\''+item.audio+'\'':'')+')">'
    +'<div class="hcard-kr">'+item.kr+'</div>'

function buildConsPanel(){
  return '<div class="hangul-section-title">기본 자음 · Basic Consonants (14)</div>'
    +'<div class="hangul-grid">'+CONSONANTS.slice(0,14).map(hcHtml).join('')+'</div>'
    +'<div class="hangul-section-title">쌍자음 · Double Consonants (5)</div>'
    +'<div class="hangul-grid">'+CONSONANTS.slice(14).map(hcHtml).join('')+'</div>'
    +'<div class="basics-intro" style="margin-top:12px;font-size:12px;">💡 <strong>Consonants need a vowel to be voiced!</strong> They cannot stand alone as a syllable.<br>'
    +'자음은 홀로 발음될 수 없어요 — 반드시 모음과 함께 써야 해요.<br><br>'
    +'⚠️ The same consonant can sound different as an <strong>initial (첫소리)</strong> vs. <strong>final consonant (받침소리)</strong>.<br>'
    +'예: ㄱ → initial: <em>g</em> (가) / final: <em>k</em> (국) · Final consonants are always one of 7 representative sounds.</div>';
}
function buildVowPanel(){
  return '<div class="hangul-section-title">기본 모음 · Simple Vowels (10)</div>'
    +'<div class="hangul-grid">'+VOWELS.slice(0,10).map(hcHtml).join('')+'</div>'
    +'<div class="hangul-section-title">복합 모음 · Compound Vowels (11)</div>'
    +'<div class="hangul-grid">'+VOWELS.slice(10).map(hcHtml).join('')+'</div>'
    +'<div class="basics-intro" style="margin-top:12px;font-size:12px;">💡 <strong>Vowel placement depends on shape:</strong><br>'
    +'세로 모음 (ㅏ ㅑ ㅓ ㅕ ㅣ) — consonant is on the <strong>left</strong>, vowel on the <strong>right</strong>: 가 나 다<br>'

}

 {kr:'가방',rom:'gabang',en:'bag',emoji:'🎒'},{kr:'딸기',rom:'ttalgi',en:'strawberry',emoji:'🍓'},
 {kr:'책',rom:'chaek',en:'book',emoji:'📚'},{kr:'밥',rom:'bap',en:'rice/meal',emoji:'🍚'},
 {kr:'국',rom:'guk',en:'soup',emoji:'🍲'},{kr:'산',rom:'san',en:'mountain',emoji:'⛰️'},

];
let _hpMode=null,_hpRounds=[],_hpIdx=0,_hpScore=0;

function _hpShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

function buildHangulPractice(){
  return '<div class="basics-intro">💡 <strong>읽기 먼저!</strong> 글자를 눈으로 읽고 소리를 고른 뒤 🔊로 확인하세요.<br><em>Read the letter first, choose the sound, then check with audio.</em></div>'
    +'<div class="btab-bar">'+HP_MODES.map(function(m){return '<button class="btab" id="hp-mode-'+m.id+'" onclick="hpStart(\''+m.id+'\')">'+m.ko+'<br><span style="font-size:9px;opacity:.8;font-weight:600">'+m.en+'</span></button>';}).join('')+'</div>'
    +'<div id="hp-area"><div class="basics-intro" style="text-align:center;background:var(--teal-50);color:var(--teal-dark)">위에서 연습 종류를 골라 시작하세요 · Pick a drill above to begin.</div></div>';
}

function _hpBuildRounds(mode){
  const rounds=[];
  if(mode==='recog'){
    const cons=CONSONANTS.map(function(c){var s=HP_CONS_SOUND[c.kr]||{};return {kr:c.kr,rom:c.rom,name:c.name,ex:c.ex,audio:s.audio,snd:s.syl||c.kr,type:'c'};});
    const vows=VOWELS.map(function(v){return {kr:v.kr,rom:v.rom,name:v.name,ex:v.ex,audio:v.audio,snd:v.kr,type:'v'};});
    const pool=cons.concat(vows);
    _hpShuffle(pool).slice(0,10).forEach(function(t){
      const same=pool.filter(function(x){return x.type===t.type&&x.rom!==t.rom;});
      const choices=_hpShuffle([t.rom].concat(_hpShuffle(same).slice(0,3).map(function(x){return x.rom;})));
      rounds.push({
        prompt:'<div style="font-size:72px;font-weight:800;color:var(--gray-900);line-height:1">'+t.kr+'</div>',
        sub:'이 글자의 소리는? · What sound is this?',
        choices:choices.map(function(c){return {label:c,ok:c===t.rom};}),
        reveal:t.name+' · '+t.kr+' → '+t.ex, speak:t.snd, audio:t.audio
      });
    });
  } else if(mode==='first'){
    _hpShuffle(CONSONANTS).slice(0,10).forEach(function(c){
      const word=(c.ex||'').split('(')[0];
      const choices=_hpShuffle([c.kr].concat(_hpShuffle(CONSONANTS.filter(function(x){return x.kr!==c.kr;})).slice(0,3).map(function(x){return x.kr;})));
      rounds.push({
        prompt:'<div style="font-size:52px;font-weight:800;color:var(--gray-900);line-height:1.1">'+word+'</div>',
        sub:'첫 자음은? · What is the first consonant?',
        choices:choices.map(function(x){return {label:x,ok:x===c.kr};}),
        reveal:word+' → 첫소리 '+c.kr+' ('+c.rom+')', speak:word
      });
    });
  } else if(mode==='syl'){
    _hpShuffle(HP_SYL).slice(0,10).forEach(function(s){
      const choices=_hpShuffle([s.rom].concat(_hpShuffle(HP_SYL.filter(function(x){return x.rom!==s.rom;})).slice(0,3).map(function(x){return x.rom;})));
      rounds.push({
        prompt:'<div style="font-size:72px;font-weight:800;color:var(--gray-900);line-height:1">'+s.kr+'</div>',
        sub:'이 음절을 읽으면? · How do you read this?',
        choices:choices.map(function(x){return {label:x,ok:x===s.rom};}),
        reveal:s.kr+' = '+s.rom, speak:s.kr
      });
    });
  } else if(mode==='coda'){
    _hpShuffle(HP_CODA).slice(0,10).forEach(function(w){
      const choices=_hpShuffle([w.rep].concat(_hpShuffle(HP_CODA_REPS.filter(function(x){return x!==w.rep;})).slice(0,3)));
      rounds.push({
        prompt:'<div style="font-size:60px;font-weight:800;color:var(--gray-900);line-height:1.1">'+w.kr+'</div>',
        sub:'받침의 <strong>대표 소리</strong>는? · Representative final sound?',
        choices:choices.map(function(x){return {label:'['+x+']',ok:x===w.rep};}),
        reveal:w.kr+' → 받침 대표음 ['+w.rep+']', speak:w.kr
      });
    });
  } else if(mode==='word'){
    _hpShuffle(HP_WORD).slice(0,10).forEach(function(w){
      const choices=_hpShuffle([w.rom].concat(_hpShuffle(HP_WORD.filter(function(x){return x.rom!==w.rom;})).slice(0,3).map(function(x){return x.rom;})));
      rounds.push({
        prompt:'<div style="font-size:56px;font-weight:800;color:var(--gray-900);line-height:1.1">'+w.kr+'</div><div style="font-size:30px;margin-top:6px">'+w.emoji+'</div>',
        sub:'이 단어를 읽으면? · How do you read this word?',
        choices:choices.map(function(x){return {label:x,ok:x===w.rom};}),
        reveal:w.kr+' = '+w.rom+' · '+w.en, speak:w.kr
      });
    });
  }
  return rounds;
}

function hpStart(mode){
  _hpMode=mode;_hpRounds=_hpBuildRounds(mode);_hpIdx=0;_hpScore=0;
  HP_MODES.forEach(function(m){const b=document.getElementById('hp-mode-'+m.id);if(b)b.classList.toggle('active',m.id===mode);});
  hpRender();
}

function hpRender(){
  const area=document.getElementById('hp-area');if(!area)return;
  if(_hpIdx>=_hpRounds.length){
    const pct=Math.round(_hpScore/_hpRounds.length*100);
    area.innerHTML='<div style="text-align:center;padding:28px 20px;background:var(--teal-50);border-radius:var(--radius-md)">'
      +'<div style="font-size:14px;color:var(--warm-600);margin-bottom:6px">연습 완료! · Drill complete</div>'
      +'<div class="lt-score-box-num">'+_hpScore+' / '+_hpRounds.length+'</div>'
      +'<div style="font-size:13px;color:var(--warm-500);margin:6px 0 16px">정답률 '+pct+'%</div>'
      +'<button class="lt-next-btn" style="max-width:220px;margin:0 auto" onclick="hpStart(\''+_hpMode+'\')">↻ 다시 하기 · Try again</button></div>';
    return;
  }
  const r=_hpRounds[_hpIdx];
  area.innerHTML='<div style="font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.08em;margin-bottom:10px">'+(_hpIdx+1)+' / '+_hpRounds.length+'</div>'
    +'<div style="text-align:center;padding:18px 12px;background:var(--teal-50);border-radius:var(--radius-md);margin-bottom:14px">'+r.prompt+'</div>'
    +'<div style="font-size:13px;font-weight:700;color:var(--warm-700);margin-bottom:10px;text-align:center">'+r.sub+'</div>'
    +'<div class="lt-opts" id="hp-opts">'+r.choices.map(function(c,i){return '<button class="lt-opt" onclick="hpChoose('+i+')">'+c.label+'</button>';}).join('')+'</div>'
    +'<div id="hp-fb"></div>';
}

function hpChoose(i){
  const r=_hpRounds[_hpIdx];const c=r.choices[i];
  const opts=document.querySelectorAll('#hp-opts .lt-opt');
  opts.forEach(function(b,j){b.onclick=null;if(r.choices[j].ok)b.classList.add('correct');});
  if(c.ok){_hpScore++;}else{opts[i].classList.add('wrong');}
  speak(r.speak,r.audio);
  const fb=document.getElementById('hp-fb');
  if(fb)fb.innerHTML='<div class="lt-exp" style="margin-top:12px">'+(c.ok?'✅ 정답! ':'❌ ')+r.reveal
    +' <button onclick="speak(\''+r.speak+'\''+(r.audio?',\''+r.audio+'\'':'')+')" style="border:none;background:var(--teal-lt);color:var(--teal-dark);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px">🔊</button></div>'
    +'<button class="lt-next-btn" onclick="hpNext()">'+(_hpIdx+1>=_hpRounds.length?'결과 보기 · See results':'다음 · Next')+'</button>';
}

function hpNext(){_hpIdx++;hpRender();}

function buildGreetings(){
  // 기본 인사 — 반말 | Casual 존댓말 | Formal 존댓말 3열 비교표
  function speakCell(txt){
    if(!txt) return '<td style="color:var(--gray-200);text-align:center;">—</td>';
    return '<td style="cursor:pointer" onclick="speakTTS(\''+txt.replace(/'/g,"\\'")+'\')">'+txt+' <span class="greet-speak-icon">🔊</span></td>';
  }
  function gTable(data){
    let rows='<tr><th>반말</th><th>Casual 존댓말</th><th>Formal 존댓말</th><th>뜻 · Meaning</th></tr>';
    data.forEach(group=>{
      rows+='<tr><td colspan="4" style="background:var(--teal-50);font-weight:800;color:var(--teal-dark);font-size:13px;padding:8px 12px;">'+group.cat+' <span style="font-weight:400;color:var(--warm-400);font-size:11px;">· '+group.cat_en+'</span></td></tr>';
      if(group.tip) rows+='<tr><td colspan="4" style="padding:0;border-top:none;"><div class="farewell-tip" style="margin:8px 12px;">'+group.tip+'</div></td></tr>';
      group.rows.forEach(r=>{
        rows+='<tr>'+speakCell(r.ban)+speakCell(r.cas)+speakCell(r.for_)+'<td style="color:var(--warm-500);font-size:12px;font-style:italic;text-align:center;">'+(r.en||'—')+'</td></tr>';
      });
    });
    return '<table class="structure-ex-table greet-table"><colgroup><col style="width:22%"><col style="width:26%"><col style="width:30%"><col style="width:22%"></colgroup>'+rows+'</table>';
  }
  // 교실 표현 카드 (텍스트 중심)
  function cCards(list){
    return list.map(c=>'<div class="class-card" onclick="speakTTS(\''+c.kr+'\')">'
      +'<div class="class-kr">'+c.kr+' <span class="greet-speak-icon">🔊</span></div>'
      +'<div class="class-rom">'+c.rom+'</div>'
      +'<div class="class-en">'+c.en+'</div></div>').join('');
  }
  // Usage 탭 — 반말/Casual 존댓말/Formal 존댓말 언제 쓰는지 가이드
  const usageCards=[
    {emoji:'😎',title:'반말 Banmal',color:'coral',who:'친구, 나보다 어리거나 아주 가까운 사이',who_en:'Friends, younger people, very close relationships',ex:'안녕! 뭐 해?',ex_en:'Hey! What are you doing?'},
    {emoji:'🙂',title:'Casual 존댓말 (해요체)',color:'teal',who:'처음 만난 사람, 어른, 선생님과 일상 대화 — 가장 흔히 쓰는 존댓말',who_en:'Strangers, elders, everyday talk with teachers — the most common polite form',ex:'안녕하세요! 뭐 하세요?',ex_en:'Hello! What are you doing?'},
    {emoji:'🎙️',title:'Formal 존댓말 (합쇼체)',color:'purple',who:'발표, 뉴스, 방송, 면접, 아주 격식 있는 자리',who_en:'Presentations, news, broadcasts, interviews, very formal settings',ex:'안녕하십니까! 발표를 시작하겠습니다.',ex_en:"Hello! I'll begin the presentation."},
  ];
  const usageTab='<div class="basics-intro">같은 말도 상대와 상황에 따라 3가지로 달라져요!<br><em>The same phrase changes depending on who you\'re talking to.</em></div>'
    +usageCards.map(u=>'<div class="vconj-verb-card" style="margin-bottom:12px;">'
      +'<div class="vconj-section-title" style="margin:0 0 8px;">'+u.emoji+' '+u.title+'</div>'
      +'<div style="font-size:12.5px;color:var(--gray-900);margin-bottom:4px;"><strong>누구에게?</strong> '+u.who+'</div>'
      +'<div style="font-size:11px;color:var(--warm-400);margin-bottom:8px;"><em>'+u.who_en+'</em></div>'
      +'<div class="qna-bubble a-bubble" style="cursor:pointer" onclick="speakTTS(\''+u.ex+'\')">'+u.ex+' 🔊<br><span style="font-size:11px;color:var(--warm-500)">'+u.ex_en+'</span></div>'
    +'</div>').join('')
    +'<div class="structure-note" style="background:var(--amber-lt);border-color:#e8b86a;color:var(--amber-600);margin-top:8px;">'
    +'⭐ <strong>빠른 판단법 · Quick Guide</strong><br>'
    +'친구·동생 → 반말 &nbsp;|&nbsp; 처음 보는 사람·어른 → Casual 존댓말 &nbsp;|&nbsp; 발표·방송 → Formal 존댓말<br>'
    +'<em>Friends/younger → Banmal | Strangers/elders → Casual polite | Presentations/broadcast → Formal polite</em>'
    +'</div>';
  const tabs=[['basic','👋 기본 인사'],['classroom','🏫 교실 표현'],['usage','📌 Usage']];
  return '<div class="basics-intro">클릭하면 발음을 들을 수 있어요! 선생님 앞에서는 항상 존댓말을 써요.<br><em>Click any cell to hear it. Always use formal speech with your teacher.</em></div>'
    +'<div class="btab-bar">'+tabs.map(([id,lbl],i)=>'<button class="btab'+(i===0?' active':'')+'" data-btab-group="bp-greet" data-tab="'+id+'" onclick="switchBtab(\'bp-greet\',\''+id+'\')">'+lbl+'</button>').join('')+'</div>'
    +'<div id="bp-greet-basic" class="btab-panel active">'+gTable(GREETINGS_TABLE)+'</div>'

// ── 큰 숫자 변환기 (Sino-Korean) ──────────────────────
function _sinoGroup(v){
  const d=['','일','이','삼','사','오','육','칠','팔','구'];
  const th=Math.floor(v/1000), h=Math.floor(v/100)%10, t=Math.floor(v/10)%10, o=v%10;
  let s='';
  if(th) s+=(th===1?'':d[th])+'천';
  if(h)  s+=(h===1?'':d[h])+'백';
  if(t)  s+=(t===1?'':d[t])+'십';
  if(o)  s+=d[o];
  return s;
}
function _sinoRead(n){
  if(n===0) return '영';
  const units=['','만','억','조'];
  let groups=[], x=n;
  while(x>0){groups.push(x%10000);x=Math.floor(x/10000);}
  let parts=[];
  for(let i=groups.length-1;i>=0;i--){
    const g=groups[i]; if(g===0) continue;
    let gs=_sinoGroup(g);
    if(i===1 && g===1) gs=''; // 만 그룹이 정확히 1이면 '일' 생략 → 만 (일만 X)
    parts.push(gs+units[i]);
  }
  return parts.join(' ');
}
function convertBigNum(){
  const inp=document.getElementById('bignum-input');
  const res=document.getElementById('bignum-result');
  if(!inp||!res) return;
  const raw=(inp.value||'').trim();
  if(raw===''){res.innerHTML='';return;}
  const n=Math.floor(Number(raw));
  if(!isFinite(n)||n<0){res.innerHTML='<span style="color:var(--coral);font-size:13px">0 이상의 숫자를 입력하세요 · Enter a number ≥ 0</span>';return;}
  if(n>999999999999){res.innerHTML='<span style="color:var(--coral);font-size:13px">최대 999,999,999,999까지예요 · Max 999,999,999,999</span>';return;}
  const kr=_sinoRead(n);
  res.innerHTML='<div style="font-size:13px;color:var(--warm-500);margin-bottom:4px">'+n.toLocaleString('en-US')+'</div>'
    +'<div style="font-size:22px;font-weight:800;color:var(--teal-dark);line-height:1.3">'+kr+'</div>'
    +'<button onclick="speakTTS(\''+kr.replace(/ /g,'')+'\')" style="margin-top:10px;border:none;background:var(--teal);color:#fff;border-radius:8px;padding:6px 16px;font-size:14px;cursor:pointer;font-weight:700">🔊 듣기</button>';
}

function buildNumbers(){
  function nCards(list){
    return '<div class="num-grid">'+list.map(n=>'<div class="num-card" onclick="speakTTS(\''+n.kr+'\')">'
      +'<div class="num-card-num">'+n.n+'</div>'
      +'<div class="num-card-kr">'+n.kr+'</div>'
      +'<div class="num-card-rom">'+n.rom+'</div>'
      +(n.hint?'<div class="num-card-hint">'+n.hint+'</div>':'')
      +'</div>').join('')+'</div>';

// ── 띄어쓰기 (WORD SPACING) GAME ───────────────────────
// ══════════════════════════════════════════════════════
const SP_DATA = [
  {chars:'나는한국어를배워요',  spaces:[2,6], en:'I am learning Korean.', hint:'나는 · 한국어를 · 배워요'},
  {chars:'저는밥을먹어요',      spaces:[2,4], en:'I eat rice.',           hint:'저는 · 밥을 · 먹어요'},
  {chars:'오늘날씨가좋아요',    spaces:[2,5], en:"Today\'s weather is nice.", hint:'오늘 · 날씨가 · 좋아요'},
  {chars:'저는한국사람이에요',  spaces:[2,4], en:'I am Korean.',          hint:'저는 · 한국 · 사람이에요'},
  {chars:'공원에서자전거를타요', spaces:[4,8], en:'I ride a bicycle in the park.', hint:'공원에서 · 자전거를 · 타요'},
  {chars:'어제친구하고공원에갔어요', spaces:[2,6,9], en:'Yesterday I went to the park with a friend.', hint:'어제 · 친구하고 · 공원에 · 갔어요'},
  {chars:'내일도서관에서공부할거예요', spaces:[2,7,10], en:'Tomorrow I will study at the library.', hint:'내일 · 도서관에서 · 공부할 · 거예요'},
  {chars:'이음식이정말맛있어요', spaces:[1,4,6], en:'This food is really delicious.', hint:'이 · 음식이 · 정말 · 맛있어요'},
  {chars:'할머니께서요리를하세요', spaces:[5,8], en:'Grandmother is cooking (honorific).', hint:'할머니께서 · 요리를 · 하세요'},
  {chars:'한국어공부가재미있어요', spaces:[3,6], en:'Korean study is fun.', hint:'한국어 · 공부가 · 재미있어요'},
];
let spIdx=0, spUserSpaces=[], spChecked=false;

function renderSpGame(){
  const box=document.getElementById('sp-game-box');
  if(!box)return;
  const d=SP_DATA[spIdx];
  const chars=[...d.chars];
  spUserSpaces=[];
  spChecked=false;
  let row='<div class="sp-char-row">';
  row+='<span class="sp-char">'+chars[0]+'</span>';
  for(let i=1;i<chars.length;i++){
    row+='<button class="sp-gap" id="spg-'+i+'" onclick="toggleSpGap('+i+')"></button>';
    row+='<span class="sp-char">'+chars[i]+'</span>';
  }
  row+='</div>';
  box.innerHTML=
    '<div class="sp-progress">'+SP_DATA.map((_,i)=>'<span class="sp-dot'+(i===spIdx?' sp-dot-cur':'')+'">&bull;</span>').join('')+'</div>'
    +'<div class="sp-en-label">'+d.en+'</div>'
    +'<div class="sp-hint-label">어디에 띄어야 할까요? Click between characters to add a space.</div>'
    +row
    +'<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;">'
    +'<button class="sp-check-btn" id="sp-check-btn" onclick="checkSpGame()">확인 Check ✓</button>'
    +'</div>'
    +'<div id="sp-feedback" style="margin-top:14px;"></div>';
}

function toggleSpGap(idx){
  if(spChecked)return;
  const btn=document.getElementById('spg-'+idx);
  if(!btn)return;
  const pos=spUserSpaces.indexOf(idx);
  if(pos===-1){
    spUserSpaces.push(idx);
    btn.classList.add('sp-gap-on');
    btn.textContent='|';
  } else {
    spUserSpaces.splice(pos,1);
    btn.classList.remove('sp-gap-on');
    btn.textContent='';
  }
}

function checkSpGame(){
  if(spChecked)return;
  spChecked=true;
  const d=SP_DATA[spIdx];
  const correct=d.spaces;
  const chars=[...d.chars];
  let allRight=true;
  // Color each gap
  for(let i=1;i<chars.length;i++){
    const btn=document.getElementById('spg-'+i);
    if(!btn)continue;
    const userHas=spUserSpaces.includes(i);
    const shouldHave=correct.includes(i);
    if(shouldHave&&userHas){
      btn.classList.add('sp-gap-correct');btn.textContent='|';
    } else if(shouldHave&&!userHas){
      btn.classList.add('sp-gap-miss');btn.textContent='|'; allRight=false;
    } else if(!shouldHave&&userHas){
      btn.classList.add('sp-gap-wrong');allRight=false;
    }
  }
  const fb=document.getElementById('sp-feedback');
  if(allRight){
    fb.innerHTML='<div class="sp-result-ok">🎉 정답! · Correct!</div>'
      +'<div class="sp-hint-reveal">'+d.hint+'</div>';
    setTimeout(()=>nextSpGame(), 1800);
  } else {
    fb.innerHTML='<div class="sp-result-no">다시 확인해 보세요. · Check again!</div>'
      +'<div class="sp-hint-reveal">정답: '+d.hint+'</div>'
      +'<button class="sp-next-btn" onclick="nextSpGame()">다음 →</button>';
  }
  const cb=document.getElementById('sp-check-btn');
  if(cb)cb.disabled=true;
}

function nextSpGame(){
  spIdx=(spIdx+1)%SP_DATA.length;
  renderSpGame();
}

function nhsRecCleanup(){
  const r=_nhsRec;
  if(r.recording){try{r.recorder.stop();}catch(e){}}
  if(r.stream){r.stream.getTracks().forEach(t=>t.stop());r.stream=null;}
  if(r.blobURL){URL.revokeObjectURL(r.blobURL);r.blobURL=null;}
  r.recording=false;r.chunks=[];r.recorder=null;
  const sb=document.getElementById('speak-btn');
  if(sb){sb.textContent='🎙️';sb.title='따라녹음하기';sb.classList.remove('rec-on');sb.classList.add('rec-done');sb.disabled=false;}
}
async function nhsRecToggle(){
  const sb=document.getElementById('speak-btn');
  if(!sb)return;
  const r=_nhsRec;
  // Has recording → play back
  if(!r.recording&&r.blobURL){
    const a=new Audio(r.blobURL);
    sb.textContent='▶';sb.disabled=true;
    a.onended=()=>{URL.revokeObjectURL(r.blobURL);r.blobURL=null;sb.textContent='🎙️';sb.title='다시 녹음하기';sb.classList.remove('rec-done');sb.disabled=false;};
    a.play();
    return;
  }
  // Recording → stop
  if(r.recording){
    try{r.recorder.stop();}catch(e){}
    return;
  }
  // Idle → start recording
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    alert('이 환경에서는 녹음을 지원하지 않아요.');return;
  }
  try{
    r.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    if(r.blobURL){URL.revokeObjectURL(r.blobURL);r.blobURL=null;}
    r.chunks=[];
    r.recorder=new MediaRecorder(r.stream);
    r.recorder.ondataavailable=e=>{if(e.data&&e.data.size)r.chunks.push(e.data);};
    r.recorder.onstop=()=>{
      r.blobURL=URL.createObjectURL(new Blob(r.chunks,{type:'audio/webm'}));
      r.recording=false;
      if(r.stream){r.stream.getTracks().forEach(t=>t.stop());r.stream=null;}
      const sb2=document.getElementById('speak-btn');
      if(sb2&&sb2.isConnected){sb2.textContent='👂';sb2.title='내발음듣기';sb2.classList.remove('rec-on');sb2.classList.add('rec-done');sb2.disabled=false;}
    };
    r.recorder.start();
    r.recording=true;
    sb.textContent='⏹';sb.title='정지';sb.classList.add('rec-on');sb.classList.remove('rec-done');
  }catch(e){
    alert('마이크 권한이 필요해요.');
  }
}


// ── SHADOWING (Web Speech API) ────────────────────────────
let _shadRec=null, _shadBtnEl=null, _shadResultId=null;

function nhsShadStop(){
  if(_shadRec){try{_shadRec.stop();}catch(e){}_shadRec=null;}
  if(_shadBtnEl){_shadBtnEl.textContent='🎤';_shadBtnEl.classList.remove('rec-on');}
  _shadBtnEl=null; _shadResultId=null;
}

function nhsShadToggle(){
  // Slide mode: shadow current scene line
  if(!DATA||!DATA.script)return;
  const line=DATA.script[sceneIdx];
  if(!line)return;
  const btn=document.getElementById('shad-btn');
  if(!btn)return;
  if(_shadRec){nhsShadStop();return;}
  _nhsShadStart(btn, line.text, 'shad-result', true);
}

function nhsShadLine(evt, targetText, resultId){
  evt.stopPropagation();
  const btn=evt.currentTarget;
  const fullResultId='shad-sr'+resultId;
  if(_shadRec){nhsShadStop(); return;}
  _nhsShadStart(btn, targetText, fullResultId, false);
}

function _nhsShadStart(btn, targetText, resultDivId, isGlobal, continuous){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Chrome 브라우저에서만 사용할 수 있어요. (설정 > 마이크 허용)');return;}
  const rec=new SR();
  _shadRec=rec; _shadBtnEl=btn; _shadResultId=resultDivId;
  rec.lang='ko-KR';
  rec.interimResults=true;
  rec.continuous=!!continuous;
  rec.maxAlternatives=1;
  btn.textContent='⏹';btn.classList.add('rec-on');
  let final='';
  rec.onresult=(e)=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) final+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    _shadShow(resultDivId, targetText, final||interim, false, isGlobal);
  };
  rec.onend=()=>{
    _shadRec=null;
    btn.textContent='🎤';btn.classList.remove('rec-on');
    _shadBtnEl=null;
    _shadShow(resultDivId, targetText, final||(isGlobal?'(소리를 인식하지 못했어요)':'❓'), true, isGlobal);
  };
  rec.onerror=(e)=>{
    _shadRec=null;
    btn.textContent='🎤';btn.classList.remove('rec-on');
    _shadBtnEl=null;
    const msg=e.error==='no-speech'?'(소리를 인식하지 못했어요)':e.error==='not-allowed'?'(마이크 권한 필요)':'(인식 실패)';
    _shadShow(resultDivId, targetText, msg, true, isGlobal);
  };
  try{rec.start();}catch(e){_shadRec=null;btn.textContent='🎤';btn.classList.remove('rec-on');}
}

function _shadShow(divId, target, said, isFinal, isGlobal){
  if(isGlobal){
    // Global shad-result panel below caption
    const panel=document.getElementById('shad-result');
    if(!panel)return;
    panel.style.display='block';
    panel.innerHTML=
      '<div class="shad-label">🎤 내가 말한 것 · I said:</div>'
      +'<div class="shad-said">'+(said||'...')+'</div>'
      +(isFinal?'<div class="shad-orig">원문 · Original: '+esc(target)+'</div>':'');
  } else {
    // Inline result below the strip/video line
    const el=document.getElementById(divId);
    if(!el)return;
    el.style.display='block';
    el.innerHTML='🎤 <strong>'+(said||'...')+'</strong>'+((isFinal&&target)?' <span style="color:#aaa;font-size:10px;">| 원문: '+esc(target)+'</span>':'');
  }
}

// ═══════════════════════════ VERB DRILL GAME ═══════════════════════════
let vdState = {};

function vdInit(gramId) {
  const g = (DATA.grammar||[]).find(function(x){return x.id===gramId;});
  if(!g||!g.verb_drill) return;
  const drillCfg = g.verb_drill;
  const verbs = drillCfg.verbs||[];
  const tenses = ['present','past','future'];
  const tenseLabels = {present:'현재형 Present',past:'과거형 Past',future:'미래형 Future'};
  let allQ = [];
  verbs.forEach(function(v){
    tenses.forEach(function(t){
      allQ.push({verb:v, tense:t, tenseLabel:tenseLabels[t],
        correct:v[t], exp:v['exp_'+t]||''});
    });
  });
  allQ = allQ.sort(function(){return Math.random()-.5;}).slice(0, drillCfg.rounds||10);
  vdState[gramId] = {questions:allQ, idx:0, score:0, verbs:verbs};
  vdRender(gramId);
}

function vdBuildOpts(gramId, qIdx) {
  const st = vdState[gramId];
  const q = st.questions[qIdx];
  const correct = q.correct;
  const pool = st.verbs.map(function(v){return v[q.tense];}).filter(function(v){return v!==correct;});
  const shuffled = pool.sort(function(){return Math.random()-.5;});
  const opts = [correct, shuffled[0], shuffled[1]].sort(function(){return Math.random()-.5;});
  return opts;
}

function vdRender(gramId) {
  const st = vdState[gramId];
  const body = document.getElementById('vd-body-'+gramId);
  if(!body) return;
  if(st.idx >= st.questions.length) { vdRenderScore(gramId); return; }
  const q = st.questions[st.idx];
  const opts = vdBuildOpts(gramId, st.idx);
  const pct = Math.round(st.idx/st.questions.length*100);
  const isLast = st.idx === st.questions.length-1;
  const optHtml = opts.map(function(o,i){
    const oSafe = o.replace(/'/g,"\\'");
    const cSafe = q.correct.replace(/'/g,"\\'");
    return '<button class="vd-opt" onclick="vdAnswer(\''+gramId+'\','+i+',this,\''+oSafe+'\',\''+cSafe+'\')"><span class="vd-opt-lbl">○</span><span>'+o+'</span><button onclick="speakTTS(\''+oSafe+'\');event.stopPropagation();" style="background:none;border:none;cursor:pointer;font-size:12px;opacity:.5;margin-left:auto" tabindex="-1">🔊</button></button>';
  }).join('');
  body.innerHTML =
    '<div class="vd-prog-bar"><div class="vd-prog-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="vd-prog-label">'+st.idx+' / '+st.questions.length+'</div>'+
    '<div class="vd-q-box">'+
      '<div style="font-size:1.8rem">'+q.verb.emoji+'</div>'+
      '<div class="vd-verb">'+q.verb.dict+'</div>'+
      '<div class="vd-tense-badge">→ '+q.tenseLabel+'?</div>'+
      '<div class="vd-tag">'+q.verb.tag+'</div>'+
    '</div>'+
    '<div class="vd-opts" id="vd-opts-'+gramId+'">'+optHtml+'</div>'+
    '<div class="vd-exp" id="vd-exp-'+gramId+'">💡 '+q.exp+'</div>'+
    '<button class="vd-next-btn" id="vd-next-'+gramId+'" onclick="vdNext(\''+gramId+'\')">'+
      (isLast?'📊 결과 보기':'다음 →')+'</button>';
}

function vdAnswer(gramId, i, btn, chosen, correct) {
  const container = document.getElementById('vd-opts-'+gramId);
  if(!container) return;
  container.querySelectorAll('.vd-opt').forEach(function(b){
    b.disabled = true;
    const lbl = b.querySelector('.vd-opt-lbl');
    const txt = b.querySelector('span:nth-child(2)');
    const val = txt ? txt.textContent.trim() : '';
    if(val === correct){ b.classList.add('correct'); if(lbl)lbl.textContent='✓'; }
    else if(b===btn && chosen!==correct){ b.classList.add('wrong'); if(lbl)lbl.textContent='✗'; }
  });
  if(chosen===correct) vdState[gramId].score++;
  const exp = document.getElementById('vd-exp-'+gramId);
  if(exp) exp.classList.add('show');
  const nxt = document.getElementById('vd-next-'+gramId);
  if(nxt) nxt.classList.add('show');
  vdState[gramId].idx++;
}

function vdNext(gramId){ vdRender(gramId); }

function vdRenderScore(gramId) {
  const st = vdState[gramId];
  const body = document.getElementById('vd-body-'+gramId);
  if(!body) return;
  const total = st.questions.length;
  const pct = Math.round(st.score/total*100);
  var grade, gradeLabel, gradeColor;
  if(pct>=90){grade='🏆';gradeLabel='완벽해요! Perfect!';gradeColor='var(--teal)';}
  else if(pct>=70){grade='🌟';gradeLabel='잘했어요! Great job!';gradeColor='var(--blue)';}
  else if(pct>=50){grade='👍';gradeLabel='좋아요! Keep going!';gradeColor='#B45309';}
  else{grade='🌱';gradeLabel='다시 해봐요! Try again!';gradeColor='var(--coral)';}
  body.innerHTML =
    '<div class="vd-score-wrap">'+
      '<div class="vd-grade">'+grade+'</div>'+
      '<div class="vd-score-num" style="color:'+gradeColor+'">'+st.score+' <span style="font-size:1.2rem;color:var(--warm-500)">/ '+total+'</span></div>'+
      '<div class="vd-grade-label" style="color:'+gradeColor+'">'+gradeLabel+'</div>'+
      '<div class="vd-score-label">'+pct+'% 정답 · accuracy</div>'+
    '</div>'+
    '<button class="vd-restart-btn" onclick="vdInit(\''+gramId+'\')">↺ 다시 도전 / Play Again</button>';
}
