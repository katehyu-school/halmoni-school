<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>도란채 — 소셜 프로필 이미지 만들기</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
 body{font-family:'Noto Sans KR',sans-serif;background:#f7f7f4;color:#292524;margin:0;padding:26px;text-align:center}
 h1{font-size:1.15rem;margin:0 0 4px}
 .sub{color:#78716c;font-size:.84rem;margin-bottom:20px}
 canvas{width:340px;height:340px;border-radius:50%;box-shadow:0 6px 24px rgba(0,0,0,.18)}
 .row{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
 button{padding:11px 20px;border:none;border-radius:999px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit}
 .p{background:#0d9488;color:#fff}.g{background:#e7e5e4;color:#44403c}
 .note{margin-top:14px;font-size:.76rem;color:#78716c;line-height:1.8}
</style></head><body>
<h1>도란채 소셜 프로필 이미지</h1>
<div class="sub">Gaegu 글꼴로 그립니다 · 1000×1000 · 원형으로 잘려도 안전</div>
<canvas id="cv" width="1000" height="1000"></canvas>
<div class="row">
  <button class="p" onclick="dl()">⬇️ PNG 내려받기 (1000×1000)</button>
  <button class="g" onclick="draw(true)">글자 없이 (심볼만)</button>
  <button class="g" onclick="draw(false)">글자 포함</button>
</div>
<div class="note">내려받은 파일을 페이스북 프로필 사진으로 올리시면 됩니다.<br>자르기 화면이 나오면 기본값 그대로 두세요.</div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function crest(cx,cy,scale){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(scale,scale); ctx.translate(-220,-102.5);
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle='#4ECDC4'; ctx.lineWidth=2.4;
  ctx.stroke(new Path2D('M153 98 Q158 93 166 97 L220 52 L274 97 Q281 93 287 98'));
  ctx.fillStyle='rgba(78,205,196,.07)';
  ctx.fill(new Path2D('M153 98 L220 52 L287 98'));
  ctx.strokeStyle='rgba(78,205,196,.55)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(156,100.6); ctx.lineTo(284,100.6); ctx.stroke();
  ctx.strokeStyle='rgba(78,205,196,.3)'; ctx.lineWidth=1.1;
  [180,220,260].forEach(x=>{ctx.beginPath();ctx.moveTo(x,101);ctx.lineTo(x,109);ctx.stroke();});
  ctx.fillStyle='#4ECDC4';                       // ㄷ
  ctx.beginPath(); ctx.roundRect(181,117,26,3.1,1.55); ctx.fill();
  ctx.beginPath(); ctx.roundRect(181,117,3.1,36,1.55); ctx.fill();
  ctx.beginPath(); ctx.roundRect(181,149.9,26,3.1,1.55); ctx.fill();
  ctx.fillStyle='#FF6B6B';                       // ㅊ
  ctx.beginPath(); ctx.arc(243,119,3.9,0,7); ctx.fill();
  ctx.beginPath(); ctx.roundRect(228,128,30,3.1,1.55); ctx.fill();
  ctx.strokeStyle='#FF6B6B'; ctx.lineWidth=3.1;
  ctx.beginPath(); ctx.moveTo(243,132.2); ctx.lineTo(232,152.5);
                   ctx.moveTo(243,132.2); ctx.lineTo(254,152.5); ctx.stroke();
  ctx.restore();
}
async function draw(symbolOnly){
  try{ await document.fonts.load('700 132px Gaegu'); await document.fonts.load('500 36px "Noto Sans KR"'); }catch(e){}
  ctx.fillStyle='#0a2540'; ctx.fillRect(0,0,1000,1000);
  ctx.strokeStyle='rgba(78,205,196,.55)'; ctx.lineWidth=10;
  ctx.beginPath(); ctx.arc(500,500,452,0,7); ctx.stroke();
  if(symbolOnly){ crest(500,505,3.55); return; }
  crest(500,430,2.95);
  ctx.textAlign='center'; ctx.fillStyle='#4ECDC4';
  ctx.font='700 150px Gaegu, serif';
  ctx.fillText('도란채', 500, 730);
  ctx.fillStyle='rgba(255,255,255,.62)';
  if('letterSpacing' in ctx) ctx.letterSpacing='15px';
  ctx.font='500 36px "Noto Sans KR", sans-serif';
  ctx.fillText('DORANCHAE', 500, 800);
  if('letterSpacing' in ctx) ctx.letterSpacing='0px';
}
function dl(){
  cv.toBlob(function(b){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='doranchae_profile_1000.png';
    a.click(); URL.revokeObjectURL(a.href);
  },'image/png');
}
// 글꼴이 도착한 뒤 한 번 더 그립니다(첫 그림이 대체 글꼴로 나오는 것 방지)
draw(false);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>draw(false));
</script></body></html>
