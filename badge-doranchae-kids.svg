<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 0 110 110" role="img">
  <title>Doranchae Kids</title>
  <desc>방패 안에 안쪽 테두리를 하나 더 두고, 별 2개와 DRC 모노그램(도·란·채 첫 글자) + KIDS를 정리했다. 2026-08-08: ㄷㅊ 자모 모노그램을 로마자로 교체(EB Garamond, 처음엔 DR 2글자 → DRC 3글자로 확정), KIDS도 Impact 대신 EB Garamond로 통일 — Impact가 샌드박스/일부 환경에서 자꾸 깨지는 문제 회피.</desc>

  <path d="M9 14 H91 V66 L50 101 L9 66 Z" fill="#3DBDB5" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M18 23 H82 V63 L50 89 L18 63 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" opacity="0.5"/>

  <g fill="#FFD93D" stroke="#0a2540" stroke-width="0.8" stroke-linejoin="round">
    <path transform="translate(28,33)" d="M0,-6 L1.47,-2.02 L5.71,-1.85 L2.38,0.77 L3.53,4.85 L0,2.5 L-3.53,4.85 L-2.38,0.77 L-5.71,-1.85 L-1.47,-2.02 Z"/>
    <path transform="translate(72,33)" d="M0,-6 L1.47,-2.02 L5.71,-1.85 L2.38,0.77 L3.53,4.85 L0,2.5 L-3.53,4.85 L-2.38,0.77 L-5.71,-1.85 L-1.47,-2.02 Z"/>
  </g>

  <text x="50" y="61" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-weight="700" font-size="20" letter-spacing="2" stroke="#0a2540" stroke-width="0.6" paint-order="stroke">
    <tspan fill="#ffffff">D</tspan><tspan fill="#0a2540">R</tspan><tspan fill="#ffffff">C</tspan>
  </text>

  <text x="50" y="88" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-weight="700" font-size="10" fill="#FFD93D" stroke="#0a2540" stroke-width="0.5" paint-order="stroke" letter-spacing="2">KIDS</text>
</svg>
